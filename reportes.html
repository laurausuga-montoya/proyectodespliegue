<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIGA | Informes y Ventas</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tema.css">
    <script src="tema.js"></script>

    <style>
        :root {
            --fondo: #121212;
            --panel: #1b1b1b;
            --verde: #37E359;
            --texto: #f4f4f4;
            --secundario: #aaa;
            --borde: #2d2d2d;
            --tarjeta-fondo: #181818;
            --tabla-cabecera: #222222;
            --fila-hover: #1e1e1e;
            --rojo: #ff5252;
            --rojo-hover: #e04444;
        }

        /* REGLAS PARA TEMA CLARO */
        body.claro {
            --fondo: #f4f4f4;
            --panel: #ffffff;
            --texto: #111111;
            --secundario: #666666;
            --borde: #dddddd;
            --tarjeta-fondo: #ffffff;
            --tabla-cabecera: #ececec;
            --fila-hover: #f9f9f9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--fondo);
            color: var(--texto);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        header {
            height: 75px;
            background: var(--panel);
            border-bottom: 1px solid var(--borde);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            position: sticky;
            top: 0;
            z-index: 100;
            transition: background 0.3s, border-color 0.3s;
        }

        .logo {
            color: var(--verde);
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            text-decoration: none;
        }

        .volver {
            color: var(--texto);
            text-decoration: none;
            font-size: 14px;
            transition: .2s;
        }

        .volver:hover {
            color: var(--verde);
        }

        main {
            width: 90%;
            max-width: 1100px;
            margin: 35px auto;
        }

        .cabecera-informes {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .cabecera-informes h1 {
            font-size: 28px;
            color: var(--verde);
        }

        .cabecera-informes p {
            font-size: 13px;
            color: var(--secundario);
            margin-top: 4px;
        }

        .btn-borrar-historial {
            background: transparent;
            color: var(--rojo);
            border: 1px solid var(--rojo);
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: .2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-borrar-historial:hover {
            background: var(--rojo);
            color: white;
        }

        .metricas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .tarjeta-metrica {
            background: var(--tarjeta-fondo);
            border: 1px solid var(--borde);
            padding: 22px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
            transition: background 0.3s, border-color 0.3s;
        }

        .tarjeta-metrica span {
            font-size: 13px;
            color: var(--secundario);
        }

        .tarjeta-metrica h3 {
            font-size: 26px;
            color: var(--verde);
            margin-top: 8px;
            font-weight: 700;
        }

        .tabla-contenedor {
            background: var(--tarjeta-fondo);
            border: 1px solid var(--borde);
            overflow-x: auto;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
            transition: background 0.3s, border-color 0.3s;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
        }

        th {
            background: var(--tabla-cabecera);
            color: var(--texto);
            padding: 15px;
            font-weight: 600;
            border-bottom: 1px solid var(--borde);
        }

        td {
            padding: 14px 15px;
            border-bottom: 1px solid var(--borde);
            color: var(--texto);
        }

        tr:hover td {
            background: var(--fila-hover);
        }

        .vacio {
            text-align: center;
            padding: 40px;
            color: var(--secundario);
        }

        @media (max-width: 650px) {
            header { padding: 0 20px; }
            .cabecera-informes { flex-direction: column; align-items: flex-start; }
            .btn-borrar-historial { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

<header>
    <a href="inicio.empresa.html" class="logo">VIGA</a>
    <a href="inicio.empresa.html" class="volver">← Volver al Panel</a>
</header>

<main>
    <div class="cabecera-informes">
        <div>
            <h1>Reporte de Ventas</h1>
            <p>Registro cronológico y rendimiento comercial de tu empresa.</p>
        </div>
        <button class="btn-borrar-historial" onclick="confirmarBorradoHistorial()">
            🗑️ Borrar Historial de Ventas
        </button>
    </div>

    <div class="metricas-grid">
        <div class="tarjeta-metrica">
            <span>Ingresos Totales</span>
            <h3 id="txtIngresosTotales">$0</h3>
        </div>
        <div class="tarjeta-metrica">
            <span>Órdenes Registradas</span>
            <h3 id="txtOrdenesTotales">0</h3>
        </div>
        <div class="tarjeta-metrica">
            <span>Unidades Despachadas</span>
            <h3 id="txtUnidadesTotales">0</h3>
        </div>
    </div>

    <div class="tabla-contenedor">
        <table>
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Producto</th>
                    <th>Cant.</th>
                    <th>Total</th>
                    <th>Cliente</th>
                    <th>Ciudad</th>
                    <th>Método</th>
                </tr>
            </thead>
            <tbody id="cuerpoTablaVentas">
                <tr>
                    <td colspan="7" class="vacio">Cargando registros...</td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<script>
    const API = "https://viga-c607.onrender.com";

    function sincronizarTema() {
        const tema = localStorage.getItem("vigaTema");
        if (tema === "claro") {
            document.body.classList.add("claro");
        } else {
            document.body.classList.remove("claro");
        }
    }
    sincronizarTema();

    function obtenerIdEmpresa() {
        const params = new URLSearchParams(window.location.search);
        const idURL = params.get("id");
        if (idURL) return idURL;

        const empresaGuardada = localStorage.getItem("empresa");
        if (empresaGuardada) {
            try {
                const emp = JSON.parse(empresaGuardada);
                return emp.id || emp.nit || emp.identificacion;
            } catch (e) {}
        }
        return null;
    }

    const idEmpresa = obtenerIdEmpresa();

    async function cargarHistorial() {
        if (!idEmpresa) {
            alert("No se identificó la sesión de la empresa.");
            window.location.href = "login.empresa.html";
            return;
        }

        try {
            const res = await fetch(`${API}/empresa/${encodeURIComponent(idEmpresa)}/ventas?t=${Date.now()}`);
            if (!res.ok) throw new Error("No se pudo cargar el reporte.");

            const ventas = await res.json();
            renderizarReporte(ventas);

        } catch (error) {
            document.getElementById("cuerpoTablaVentas").innerHTML = `
                <tr><td colspan="7" class="vacio" style="color:var(--rojo);">Error al conectar con la base de datos.</td></tr>
            `;
        }
    }

    function renderizarReporte(ventas) {
        const tbody = document.getElementById("cuerpoTablaVentas");
        tbody.innerHTML = "";

        if (!ventas || ventas.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="vacio">No hay ventas registradas aún.</td></tr>`;
            document.getElementById("txtIngresosTotales").textContent = "$0";
            document.getElementById("txtOrdenesTotales").textContent = "0";
            document.getElementById("txtUnidadesTotales").textContent = "0";
            return;
        }

        let ingresos = 0;
        let unidades = 0;

        ventas.forEach(v => {
            ingresos += Number(v.total || 0);
            unidades += parseInt(v.cantidad || 0, 10);

            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${v.fecha || 'Reciente'}</td>
                <td><strong>${v.nombre_producto}</strong></td>
                <td>${v.cantidad}</td>
                <td style="color:var(--verde); font-weight:600;">$${Number(v.total).toLocaleString('es-CO')}</td>
                <td>${v.cliente_nombre || 'Cliente'}</td>
                <td>${v.cliente_ciudad || 'Colombia'}</td>
                <td>${v.metodo_pago || 'Directo'}</td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById("txtIngresosTotales").textContent = `$${ingresos.toLocaleString('es-CO')}`;
        document.getElementById("txtOrdenesTotales").textContent = ventas.length;
        document.getElementById("txtUnidadesTotales").textContent = unidades;
    }

    async function confirmarBorradoHistorial() {
        if (!confirm("¿Estás seguro de que deseas vaciar todo el historial de ventas? Esta acción es irreversible.")) {
            return;
        }

        try {
            const res = await fetch(`${API}/empresa/${encodeURIComponent(idEmpresa)}/ventas`, {
                method: "DELETE"
            });

            if (!res.ok) throw new Error("No se pudo eliminar el historial.");

            alert("Historial de ventas vaciado con éxito.");
            cargarHistorial();

        } catch (error) {
            alert("Ocurrió un error al intentar borrar el historial.");
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        sincronizarTema();
        cargarHistorial();
    });
</script>

</body>
</html>

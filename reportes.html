<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIGA | Historial de Compras</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --fondo: #121212;
            --panel: #1b1b1b;
            --verde: #37E359;
            --texto: #f4f4f4;
            --secundario: #aaa;
            --borde: #2d2d2d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--fondo);
            color: var(--texto);
            min-height: 100vh;
        }

        header {
            height: 80px;
            background: var(--panel);
            border-bottom: 1px solid var(--borde);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 60px;
        }

        .logo {
            font-size: 34px;
            font-weight: 700;
            color: var(--verde);
            letter-spacing: 2px;
            text-decoration: none;
        }

        .volver {
            color: #ddd;
            text-decoration: none;
            transition: .2s;
            font-size: 14px;
        }

        .volver:hover {
            color: var(--verde);
        }

        .contenedor {
            width: 90%;
            max-width: 1100px;
            margin: 45px auto;
        }

        .titulo {
            margin-bottom: 35px;
            text-align: center;
        }

        .titulo h1 {
            font-size: 36px;
            color: var(--verde);
            margin-bottom: 8px;
        }

        .titulo p {
            color: var(--secundario);
            font-size: 15px;
        }

        /* RESUMEN RÁPIDO */
        .metricas {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 35px;
        }

        .metrica-card {
            background: var(--panel);
            border: 1px solid var(--borde);
            border-radius: 0px;
            padding: 20px;
            text-align: center;
        }

        .metrica-card span {
            font-size: 13px;
            color: var(--secundario);
            display: block;
            margin-bottom: 5px;
        }

        .metrica-card strong {
            font-size: 26px;
            color: var(--verde);
        }

        /* LISTA DE PEDIDOS */
        .pedidos-lista {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .pedido-card {
            background: var(--panel);
            border: 1px solid var(--borde);
            border-radius: 0px;
            padding: 25px;
            transition: .3s;
        }

        .pedido-card:hover {
            border-color: #3b3b3b;
            transform: translateY(-2px);
        }

        .pedido-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #282828;
            padding-bottom: 14px;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .pedido-id {
            font-size: 16px;
            font-weight: 700;
            color: white;
        }

        .pedido-fecha {
            font-size: 13px;
            color: var(--secundario);
        }

        .estado-badge {
            display: inline-block;
            background: rgba(55, 227, 89, 0.15);
            color: var(--verde);
            padding: 5px 12px;
            border-radius: 0px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(55, 227, 89, 0.3);
        }

        .pedido-items {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 18px;
        }

        .item-fila {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .item-fila img {
            width: 50px;
            height: 50px;
            border-radius: 0px;
            object-fit: cover;
            background: #222;
        }

        .item-info {
            flex-grow: 1;
        }

        .item-info h4 {
            font-size: 14px;
            color: #ddd;
            margin-bottom: 3px;
        }

        .item-info span {
            font-size: 12px;
            color: var(--secundario);
        }

        .item-precio {
            font-weight: 600;
            font-size: 14px;
            color: white;
        }

        .pedido-footer {
            border-top: 1px solid #282828;
            padding-top: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .pedido-metodo {
            font-size: 13px;
            color: var(--secundario);
        }

        .pedido-total {
            font-size: 18px;
            font-weight: 700;
            color: var(--verde);
        }

        .vacio {
            text-align: center;
            padding: 60px 20px;
            background: var(--panel);
            border-radius: 0px;
            border: 1px solid var(--borde);
            color: var(--secundario);
        }

        .btn-ir-tienda {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: var(--verde);
            color: #111;
            font-weight: 700;
            border-radius: 0px;
            text-decoration: none;
            transition: .2s;
        }

        .btn-ir-tienda:hover {
            filter: brightness(1.1);
        }

        footer {
            text-align: center;
            color: #777;
            padding: 40px;
            font-size: 13px;
        }

        @media(max-width: 700px) {
            header { padding: 0 20px; }
            .metricas { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>

<header>
    <a href="tienda.html" class="logo">VIGA</a>
    <a href="tienda.html" class="volver">← Volver a la tienda</a>
</header>

<div class="contenedor">

    <div class="titulo">
        <h1>Historial de Compras</h1>
        <p>Revisa el detalle de tus pedidos, compras aprobadas e implementos adquiridos.</p>
    </div>

    <!-- MÉTRICAS RÁPIDAS -->
    <div class="metricas">
        <div class="metrica-card">
            <span>Total de compras realizadas</span>
            <strong id="contadorCompras">0</strong>
        </div>
        <div class="metrica-card">
            <span>Inversión total en implementos</span>
            <strong id="montoTotalInvertido">$ 0</strong>
        </div>
    </div>

    <!-- LISTA DE PEDIDOS -->
    <div class="pedidos-lista" id="contenedorHistorial">
        <!-- Renderizado dinámico -->
    </div>

</div>

<footer>
    © 2026 VIGA · Vive saludable, entrena inteligente.
</footer>

<script>
    function dinero(valor) {
        return Number(valor || 0).toLocaleString("es-CO", {
            style: "currency",
            currency: "COP",
            maximumFractionDigits: 0
        });
    }

    function cargarHistorial() {
        // Lee el historial guardado en el navegador
        const historial = JSON.parse(localStorage.getItem("viga_historial_compras") || "[]");
        const contenedor = document.getElementById("contenedorHistorial");
        const contador = document.getElementById("contadorCompras");
        const totalInvertido = document.getElementById("montoTotalInvertido");

        contador.textContent = historial.length;

        if (historial.length === 0) {
            contenedor.innerHTML = `
                <div class="vacio">
                    <h2>Aún no has realizado compras</h2>
                    <p style="margin-top: 8px;">Explora la tienda oficial y adquiere tus implementos deportivos.</p>
                    <a href="tienda.html" class="btn-ir-tienda">Ir a la tienda</a>
                </div>
            `;
            totalInvertido.textContent = "$ 0";
            return;
        }

        let sumaGlobal = 0;
        contenedor.innerHTML = "";

        // Mostrar del más reciente al más antiguo
        historial.slice().reverse().forEach((pedido, idx) => {
            sumaGlobal += Number(pedido.total || 0);

            const card = document.createElement("div");
            card.className = "pedido-card";

            const productosHtml = (pedido.articulos || []).map(art => `
                <div class="item-fila">
                    <img src="${art.imagen}" alt="${art.nombre}" onerror="this.src='https://images.unsplash.com/photo-1584735935682-2f2b69dff9d2?auto=format&fit=crop&w=800&q=80'">
                    <div class="item-info">
                        <h4>${art.nombre}</h4>
                        <span>Cantidad: ${art.cantidad} unidad(es)</span>
                    </div>
                    <div class="item-precio">${dinero(art.precio * art.cantidad)}</div>
                </div>
            `).join("");

            card.innerHTML = `
                <div class="pedido-header">
                    <div>
                        <div class="pedido-id">Orden #${pedido.idOrden || (1000 + idx)}</div>
                        <div class="pedido-fecha">📅 ${pedido.fecha || "Fecha reciente"} · Envío a: ${pedido.ciudad || "Colombia"}</div>
                    </div>
                    <span class="estado-badge">✓ Pago Aprobado</span>
                </div>

                <div class="pedido-items">
                    ${productosHtml || "<p style='color:#aaa; font-size:13px;'>Implementos deportivos adquiridos</p>"}
                </div>

                <div class="pedido-footer">
                    <div class="pedido-metodo">
                        💳 Método: <strong>${pedido.banco || pedido.metodo || "Transferencia/Tarjeta"}</strong>
                    </div>
                    <div class="pedido-total">
                        Total: ${dinero(pedido.total)}
                    </div>
                </div>
            `;

            contenedor.appendChild(card);
        });

        totalInvertido.textContent = dinero(sumaGlobal);
    }

    document.addEventListener("DOMContentLoaded", cargarHistorial);
</script>

</body>
</html>

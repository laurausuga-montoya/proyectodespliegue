        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #121212;
            color: white;
            min-height: 100vh;
        }

        /* ================= HEADER ================= */

        header {
            height: 80px;
            background: #1b1b1b;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 60px;

            border-bottom: 1px solid #2d2d2d;
        }

        .logo {
            font-size: 40px;
            font-weight: 700;
            color: #37E359;
            letter-spacing: 2px;
        }

        .volver {
            color: #ddd;
            text-decoration: none;
        }

        .volver:hover {
            color: #37E359;
        }

        /* ================= CONTENEDOR ================= */

        .contenedor {
            width: 90%;
            max-width: 1200px;
            margin: 50px auto;
        }

        .titulo {
            text-align: center;
            margin-bottom: 30px;
        }

        .titulo h1 {
            color: #37E359;
            font-size: 40px;
            margin-bottom: 10px;
        }

        .titulo p {
            color: #aaa;
        }

        /* ================= DATOS ================= */

        .datos {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .dato {
            background: #1b1b1b;
            padding: 18px 30px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #292929;
        }

        .dato span {
            display: block;
            color: #999;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .dato strong {
            color: #37E359;
            font-size: 21px;
        }

        /* ================= DIAS ================= */

        .dias {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .dia {
            border: none;
            background: #252525;
            color: #ddd;

            padding: 14px 28px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 15px;
            font-weight: 500;

            transition: .3s;
        }

        .dia:hover {
            background: #303030;
        }

        .dia.activo {
            background: #37E359;
            color: #111;
            font-weight: 700;
        }

        /* ================= DIA SELECCIONADO ================= */

        .dia-titulo {
            text-align: center;
            margin-bottom: 25px;
        }

        .dia-titulo h2 {
            font-size: 28px;
        }

        .dia-titulo span {
            color: #37E359;
        }

        /* ================= COMIDAS ================= */

        .comidas {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .comida {
            background: #1b1b1b;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid #292929;
            transition: .3s;
        }

        .comida:hover {
            transform: translateY(-5px);
            border-color: #37E359;
        }

        .comida img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .contenido {
            padding: 25px;
        }

        .contenido h2 {
            color: #37E359;
            margin-bottom: 8px;
        }

        .contenido h3 {
            color: #888;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .contenido ul {
            list-style: none;
        }

        .contenido li {
            color: #ccc;
            padding: 7px 0;
            border-bottom: 1px solid #292929;
        }

        .contenido li:last-child {
            border-bottom: none;
        }

        /* ================= RECOMENDACION ================= */

        .recomendacion {
            margin-top: 35px;

            background: #1b1b1b;

            padding: 25px;

            border-left: 4px solid #37E359;

            border-radius: 12px;
        }

        .recomendacion h2 {
            color: #37E359;
            margin-bottom: 10px;
        }

        .recomendacion p {
            color: #aaa;
            line-height: 28px;
        }

        /* ================= FOOTER ================= */

        footer {
            text-align: center;
            color: #777;
            padding: 40px;
        }

        /* =========================
           MODO CLARO
        ========================= */

        body.tema-claro {
            background: #f5f5f5;
            color: #222;
        }

        body.tema-claro header {

            border-bottom-color: #dddddd;

/* =====================================================
   MOSTRAR DIA
===================================================== */

function mostrarDia(dia, boton) {

    document
        .querySelectorAll(".dia")
        .forEach(function(btn) {

            btn.classList.remove("activo");

        });


    boton.classList.add("activo");


    document.getElementById("nombreDia").textContent =
        planes[dia].nombre;


    const contenedor =
        document.getElementById("comidas");


    contenedor.innerHTML = "";


    planes[dia].comidas.forEach(function(comida) {

        const tarjeta =
            document.createElement("div");


        tarjeta.className =
            "comida";


        tarjeta.innerHTML = `

            <img
                src="${comida.imagen}"
                alt="${comida.titulo}"
            >

            <div class="contenido">

                <h2>
                    ${comida.titulo}
                </h2>

                <h3>
                    ${comida.hora}
                </h3>

                <ul>

                    ${comida.alimentos
                        .map(function(alimento) {

                            return `
                                <li>
                                    ✓ ${alimento}
                                </li>
                            `;

                        })
                        .join("")
                    }

                </ul>

            </div>

        `;


        contenedor.appendChild(tarjeta);

    });

}


/* =====================================================
   MOSTRAR LUNES AL ABRIR
===================================================== */

document.addEventListener(

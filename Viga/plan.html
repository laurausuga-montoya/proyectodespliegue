<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIGA | Plan de alimentación</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="tema.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #121212;
            color: white;
            min-height: 100vh;
        }

        /* HEADER */
        header {
            height: 80px;
            background: #1b1b1b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 60px;
            border-bottom: 1px solid #2d2d2d;
        }

        .logo {
            font-size: 40px;
            font-weight: 700;
            color: #37E359;
            letter-spacing: 2px;
        }

        .volver {
            color: #ddd;
            text-decoration: none;
            transition: .2s;
        }

        .volver:hover {
            color: #37E359;
        }

        /* CONTENEDOR */
        .contenedor {
            width: 90%;
            max-width: 1200px;
            margin: 50px auto;
        }

        .titulo {
            text-align: center;
            margin-bottom: 30px;
        }

        .titulo h1 {
            color: #37E359;
            font-size: 40px;
            margin-bottom: 10px;
        }

        .titulo p {
            color: #aaa;
        }

        /* DATOS */
        .datos {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .dato {
            background: #1b1b1b;
            padding: 18px 30px;
            border-radius: 0px;
            text-align: center;
            border: 1px solid #292929;
            min-width: 140px;
        }

        .dato span {
            display: block;
            color: #999;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .dato strong {
            color: #37E359;
            font-size: 21px;
        }

        /* DÍAS (LUNES A DOMINGO) */
        .dias {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .dia {
            border: none;
            background: #252525;
            color: #ddd;
            padding: 12px 22px;
            border-radius: 0px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: .3s;
        }

        .dia:hover {
            background: #303030;
        }

        .dia.activo {
            background: #37E359;
            color: #111;
            font-weight: 700;
        }

        /* TITULO DEL DÍA */
        .dia-titulo {
            text-align: center;
            margin-bottom: 25px;
        }

        .dia-titulo h2 {
            font-size: 28px;
        }

        .dia-titulo span {
            color: #37E359;
        }

        /* COMIDAS */
        .comidas {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .comida {
            background: #1b1b1b;
            border-radius: 0px;
            overflow: hidden;
            border: 1px solid #292929;
            transition: .3s;
            display: flex;
            flex-direction: column;
        }

        .comida.premio {
            border: 1px solid #ffb703;
            box-shadow: 0 0 15px rgba(255, 183, 3, 0.15);
        }

        .comida:hover {
            transform: translateY(-5px);
            border-color: #37E359;
        }

        .comida.premio:hover {
            border-color: #ffb703;
        }

        .comida img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .contenido {
            padding: 25px;
            flex-grow: 1;
        }

        .contenido h2 {
            color: #37E359;
            margin-bottom: 8px;
            font-size: 22px;
        }

        .comida.premio .contenido h2 {
            color: #ffb703;
        }

        .contenido h3 {
            color: #888;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .contenido ul {
            list-style: none;
        }

        .contenido li {
            color: #ccc;
            padding: 7px 0;
            border-bottom: 1px solid #292929;
            font-size: 14px;
            line-height: 1.6;
        }

        .contenido li:last-child {
            border-bottom: none;
        }

        /* RECOMENDACIÓN */
        .recomendacion {
            margin-top: 35px;
            background: #1b1b1b;
            padding: 25px;
            border-left: 4px solid #37E359;
            border-radius: 0px;
        }

        .recomendacion h2 {
            color: #37E359;
            margin-bottom: 10px;
        }

        .recomendacion p {
            color: #aaa;
            line-height: 28px;
        }

        footer {
            text-align: center;
            color: #777;
            padding: 40px;
        }

        /* TEMA CLARO */
        html.tema-claro body,
        body.tema-claro {
            background: #f5f5f5;
            color: #222;
        }

        html.tema-claro header,
        body.tema-claro header {
            background: #ffffff;
            border-bottom-color: #dddddd;
        }

        html.tema-claro .volver,
        body.tema-claro .volver {
            color: #555;
        }

        html.tema-claro .titulo p,
        body.tema-claro .titulo p {
            color: #666;
        }

        html.tema-claro .dato,
        body.tema-claro .dato {
            background: #ffffff;
            border-color: #dddddd;
        }

        html.tema-claro .dato span,
        body.tema-claro .dato span {
            color: #666;
        }

        html.tema-claro .dia,
        body.tema-claro .dia {
            background: #e8e8e8;
            color: #222;
        }

        html.tema-claro .dia:hover,
        body.tema-claro .dia:hover {
            background: #dcdcdc;
        }

        html.tema-claro .dia.activo,
        body.tema-claro .dia.activo {
            background: #37E359;
            color: #111;
        }

        html.tema-claro .comida,
        body.tema-claro .comida {
            background: #ffffff;
            border-color: #dddddd;
        }

        html.tema-claro .contenido h3,
        body.tema-claro .contenido h3 {
            color: #777;
        }

        html.tema-claro .contenido li,
        body.tema-claro .contenido li {
            color: #444;
            border-bottom-color: #dddddd;
        }

        html.tema-claro .recomendacion,
        body.tema-claro .recomendacion {
            background: #ffffff;
        }

        html.tema-claro .recomendacion p,
        body.tema-claro .recomendacion p {
            color: #666;
        }

        @media(max-width: 800px) {
            .comidas { grid-template-columns: 1fr; }
            header { padding: 0 25px; }
            .titulo h1 { font-size: 30px; }
        }
    </style>
</head>

   LECTURA DE PARÁMETROS Y DATOS
===================================================== */
const parametros = new URLSearchParams(window.location.search);
let pesoActual = parametros.get("actual") || parametros.get("peso");
let pesoObjetivo = parametros.get("objetivo");
let tipo = parametros.get("tipo");

// Consultar backup local si no vienen por URL
if (!tipo || !pesoActual) {
    const sesionUsuario = localStorage.getItem("usuario") || localStorage.getItem("usuarioLogueado");
    let uid = "";
    if (sesionUsuario) {
        try { uid = JSON.parse(sesionUsuario).identificacion; } catch (e) {}
    }
    const guardado = localStorage.getItem(`plan_alimentacion_${uid}`) || localStorage.getItem("plan_alimentacion_guardado");
    if (guardado) {
        try {
            const parsed = JSON.parse(guardado);
            pesoActual = parsed.actual;
            pesoObjetivo = parsed.objetivo;
            tipo = parsed.tipo;
        } catch(e) {}
    }
}

document.getElementById("pesoActual").textContent = pesoActual ? `${pesoActual} kg` : "--";
document.getElementById("pesoObjetivo").textContent = pesoObjetivo ? `${pesoObjetivo} kg` : "--";

let objetivoTexto = "Mantener peso";
let recomendacion = "Mantén una alimentación equilibrada combinando proteínas, carbohidratos, frutas, verduras y grasas saludables.";

    tipo = "bajar";
    objetivoTexto = "Bajar de peso";
    recomendacion = "Prioriza alimentos naturales, verduras de hoja verde, proteínas magras y consume mínimo 2.5 litros de agua al día.";
} else if (tipo === "subir" || tipo === "subir_peso") {
    tipo = "subir";
    objetivoTexto = "Aumentar masa / peso";
    recomendacion = "Asegura un superávit calórico controlado: no te saltes comidas, incluye frutos secos, avena, carbohidratos limpios y proteínas en cada comida.";
} else {
    tipo = "mantener";
    objetivoTexto = "Definir y Mantener";
}

document.getElementById("tipoObjetivo").textContent = objetivoTexto;
document.getElementById("mensaje").textContent = "Plan semanal personalizado para " + objetivoTexto.toLowerCase();
document.getElementById("recomendacionTexto").textContent = recomendacion;

/* =========================================================
   MOSTRAR DÍA EN PANTALLA
========================================================= */
function mostrarDia(dia, boton) {
    document.querySelectorAll(".dia").forEach(btn => btn.classList.remove("activo"));
    if (boton) boton.classList.add("activo");

    const diaData = planActivo[dia];
    if (!diaData) return;

    document.getElementById("nombreDia").textContent = diaData.nombre;
    const contenedor = document.getElementById("comidas");
    contenedor.innerHTML = "";

    diaData.comidas.forEach(comida => {
        const tarjeta = document.createElement("div");
        tarjeta.className = `comida ${comida.esPremio ? "premio" : ""}`;

        tarjeta.innerHTML = `
            <img src="${comida.imagen}" alt="${comida.titulo}" loading="lazy">
            <div class="contenido">
                <h2>${comida.titulo}</h2>
                <h3> ${comida.hora}</h3>
                <ul>
                    ${comida.alimentos.map(alimento => `<li>✓ ${alimento}</li>`).join("")}
                </ul>
            </div>
        `;
        contenedor.appendChild(tarjeta);
    });
}

document.addEventListener("DOMContentLoaded", () => {
    const primerBoton = document.querySelector(".dia");
    mostrarDia("lunes", primerBoton);
});

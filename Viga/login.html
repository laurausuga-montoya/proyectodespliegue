<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VIGA | Iniciar Sesión</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {

            min-height: 100vh;

            background:
                linear-gradient(
                    rgba(0, 0, 0, .72),
                    rgba(0, 0, 0, .72)
                ),
                url("https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1600&q=80");

            background-size: cover;

            background-position: center;

            display: flex;

            justify-content: center;

            align-items: center;

            color: white;

        }

        .contenedor {

            width: 420px;

            max-width: 90%;

            background: #1b1b1b;

            padding: 45px;

            border-radius: 20px;

            border: 1px solid #333;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,.6);

        }

        .logo {

            text-align: center;

            color: #37E359;

            font-size: 50px;

            font-weight: 700;

            letter-spacing: 3px;

            margin-bottom: 5px;

        }

        h1 {

            text-align: center;

            font-size: 28px;

            margin-bottom: 8px;

        }

        .descripcion {

            text-align: center;

            color: #999;

            margin-bottom: 30px;

        }

        .campo {

            margin-bottom: 20px;

        }

        label {

            display: block;

            margin-bottom: 8px;

            color: #ddd;

            font-weight: 500;

        }

        input {

            width: 100%;

            padding: 14px;

            background: #252525;

            color: white;

            border: 1px solid #444;

            border-radius: 10px;

            outline: none;

            font-size: 15px;

        }

        input:focus {

            border-color: #37E359;

        }

        .boton {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 10px;

            background: #37E359;

            color: #111;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 10px;

            transition: .3s;

        }

        .boton:hover {

            background: #65ef7d;

            transform: translateY(-2px);

        }

        #mensaje {

            display: none;

            padding: 12px;

            margin-bottom: 15px;

            border-radius: 8px;

            text-align: center;

            background: #3b2020;

            color: #ff8585;

        }

        .registro {

            text-align: center;

            margin-top: 25px;

            color: #999;

        }

        .registro a {

            color: #37E359;

            text-decoration: underline;

        }

        .registro a:hover {

            color: #65ef7d;

        }

    </style>

</head>


<body>


<div class="contenedor">


    <div class="logo">
        VIGA
    </div>


    <h1>
        Iniciar sesión
    </h1>


    <p class="descripcion">
        Ingresa a tu cuenta para continuar
    </p>


    <div id="mensaje"></div>


    <div class="campo">

        <label for="usuario">
            Correo, teléfono o identificación
        </label>

        <input
            type="text"
            id="usuario"
            placeholder="Ingresa tus datos"
        >

    </div>


    <div class="campo">

        <label for="password">
            Contraseña
        </label>

        <input
            type="password"
            id="password"
            placeholder="Ingresa tu contraseña"
        >

    </div>


    <button
        class="boton"
        onclick="iniciarSesion()"
    >
        Iniciar sesión
    </button>


    <div class="registro">

        ¿No tienes una cuenta?

        <a href="index.html">
            Registrarse
        </a>

    </div>


</div>


<script>

async function iniciarSesion() {


    const usuario =
        document
            .getElementById("usuario")
            .value
            .trim();


    const password =
        document
            .getElementById("password")
            .value;


    const mensaje =
        document.getElementById("mensaje");


    mensaje.style.display = "none";


    /*
       VALIDAR CAMPOS
    */

    if (!usuario || !password) {

        mensaje.textContent =
            "Por favor, completa todos los campos.";

        mensaje.style.display =
            "block";

        return;

    }


    try {


        /*
           ENVIAR DATOS A APP.JS
        */

        const respuesta =
            await fetch(
                "http://localhost:3000/login",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        usuario:
                            usuario,

                        password:
                            password

                    })

                }
            );


        const data =
            await respuesta.json();


        console.log(
            "Respuesta del servidor:",
            data
        );


        /*
           SI EL LOGIN FALLÓ
        */

        if (!respuesta.ok) {

            mensaje.textContent =
                data.error ||
                "Usuario o contraseña incorrectos.";

            mensaje.style.display =
                "block";

            return;

        }


        /*
           OBTENER IDENTIFICACIÓN
           DESDE MYSQL
        */

        if (
            !data.usuario ||
            !data.usuario.identificacion
        ) {

            mensaje.textContent =
                "No se pudo obtener la identificación del usuario.";

            mensaje.style.display =
                "block";

            return;

        }


        const identificacion =
            data.usuario.identificacion;


        console.log(
            "Identificación:",
            identificacion
        );


        /*
           PASAR IDENTIFICACIÓN A INICIO

           NO UTILIZAMOS LOCALSTORAGE
        */

        window.location.href =
            "inicio.html?id=" +
            encodeURIComponent(
                identificacion
            );


    } catch (error) {


        console.error(
            "Error conectando con app.js:",
            error
        );


        mensaje.textContent =
            "No se pudo conectar con el servidor. Verifica que app.js esté ejecutándose.";

        mensaje.style.display =
            "block";

    }

}


/*
   PERMITIR ENTER PARA INICIAR SESIÓN
*/

document
    .getElementById("password")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                iniciarSesion();

            }

        }
    );

</script>


</body>

</html>

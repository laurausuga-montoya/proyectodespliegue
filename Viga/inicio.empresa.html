<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIGA | Panel Empresarial</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tema.css">
    <script src="tema.js"></script>

    <style>
        :root {
            --fondo: #121212;
            --panel: #1b1b1b;
            --verde: #37E359;
            --texto: #f4f4f4;
            --secundario: #aaa;
            --borde: #2d2d2d;
            --input-fondo: #252525;
            --input-borde: #3b3b3b;
            --rojo: #ff5252;
        }

        body.claro {
            --fondo: #f4f4f4;
            --panel: #ffffff;
            --texto: #111111;
            --secundario: #666666;
            --borde: #dddddd;
            --input-fondo: #f8f8f8;
            --input-borde: #cccccc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--fondo);
            color: var(--texto);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        header {
            height: 75px;
            background: var(--panel);
            border-bottom: 1px solid var(--borde);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: var(--verde);
            text-decoration: none;
            letter-spacing: 2px;
        }

        .empresa-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-cerrar {
            background: transparent;
            border: 1px solid var(--borde);
            color: var(--texto);
            padding: 8px 16px;
            cursor: pointer;
            font-size: 13px;
            transition: .2s;
        }

        .btn-cerrar:hover {
            color: var(--rojo);
            border-color: var(--rojo);
        }

        main {
            width: 90%;
            max-width: 1100px;
            margin: 35px auto;
        }

        .pestanas {
            display: flex;
            gap: 15px;
            border-bottom: 1px solid var(--borde);
            margin-bottom: 25px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--secundario);
            font-size: 15px;
            font-weight: 600;
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: .2s;
        }

        .tab-btn.activo {
            color: var(--verde);
            border-bottom-color: var(--verde);
        }

        .contenedor-seccion {
            display: none;
        }

        .contenedor-seccion.activo {
            display: block;
        }

        .reporte-card {
            background: var(--panel);
            border: 1px solid var(--borde);
            padding: 22px;
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .reporte-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--borde);
            padding-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge-estado {
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 700;
        }

        .badge-pendiente {
            background: rgba(255, 183, 77, 0.15);
            color: #ffb74d;
            border: 1px solid rgba(255, 183, 77, 0.3);
        }

        .badge-resuelto {
            background: rgba(55, 227, 89, 0.15);
            color: var(--verde);
            border: 1px solid rgba(55, 227, 89, 0.3);
        }

        .btn-resolver {
            background: var(--verde);
            color: #111;
            border: none;
            padding: 10px 18px;
            font-weight: 700;
            cursor: pointer;
            align-self: flex-start;
            font-size: 13px;
            transition: .2s;
        }

        .btn-resolver:hover {
            filter: brightness(1.1);
        }

        .img-evidencia-min {
            max-width: 140px;
            max-height: 140px;
            object-fit: cover;
            border: 1px solid var(--borde);
            margin-top: 8px;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">VIGA EMPRESA</div>
        <div class="empresa-info">
            <span id="txtNombreEmpresa" style="font-size: 14px; font-weight: 600;">Empresa</span>
            <button class="btn-cerrar" onclick="cerrarSesion()">Cerrar sesión</button>
        </div>
    </header>

    <main>
        <div class="pestanas">
            <button class="tab-btn activo" onclick="cambiarTab('reportes', this)">Buzón de Reportes</button>
            <button class="tab-btn" onclick="cambiarTab('productos', this)">Gestión de Productos</button>
        </div>

        <!-- SECCIÓN REPORTES -->
        <div id="seccion-reportes" class="contenedor-seccion activo">
            <div id="listaReportes">
                <p style="color: var(--secundario);">Cargando reportes dirigidos a tu empresa...</p>
            </div>
        </div>

        <!-- SECCIÓN PRODUCTOS -->
        <div id="seccion-productos" class="contenedor-seccion">
            <p style="color: var(--secundario);">Administra el inventario de tu tienda oficial desde aquí.</p>
        </div>
    </main>

    <script>
        const API = "https://viga-c607.onrender.com";

        function sincronizarTema() {
            const tema = localStorage.getItem("vigaTema");
            if (tema === "claro") document.body.classList.add("claro");
        }
        sincronizarTema();

        function obtenerEmpresa() {
            const raw = localStorage.getItem("empresa") || localStorage.getItem("usuario");
            if (raw) {
                try { return JSON.parse(raw); } catch (e) {}
            }
            return { nit: "4560987-9", nombre: "Empresa Asociada" };
        }

        const empresaActual = obtenerEmpresa();
        const nitEmpresa = empresaActual.nit || empresaActual.identificacion || "4560987-9";

        document.getElementById("txtNombreEmpresa").textContent = `${empresaActual.nombre || 'Mi Empresa'} (NIT: ${nitEmpresa})`;

        function cambiarTab(tab, btn) {
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("activo"));
            document.querySelectorAll(".contenedor-seccion").forEach(s => s.classList.remove("activo"));

            btn.classList.add("activo");
            document.getElementById(`seccion-${tab}`).classList.add("activo");
        }

        // Redirige a la nueva hoja de resolución pasando ID y NIT
        function irAResolver(idReporte, nit) {
            window.location.href = `resolver.reporte.html?id=${encodeURIComponent(idReporte)}&nit=${encodeURIComponent(nit)}`;
        }

        async function cargarReportes() {
            const contenedor = document.getElementById("listaReportes");
            const storageKey = "reportes_nit_" + nitEmpresa;
            let reportes = JSON.parse(localStorage.getItem(storageKey) || "[]");

            try {
                const res = await fetch(`${API}/empresa/${encodeURIComponent(nitEmpresa)}/reportes?t=${Date.now()}`);
                if (res.ok) {
                    const datosServer = await res.json();
                    if (datosServer && datosServer.length > 0) reportes = datosServer;
                }
            } catch (e) {}

            if (!reportes || reportes.length === 0) {
                contenedor.innerHTML = `<p style="padding: 40px; text-align: center; color: var(--secundario); background: var(--panel); border: 1px solid var(--borde);">No hay reportes de soporte pendientes para tu empresa.</p>`;
                return;
            }

            contenedor.innerHTML = "";
            reportes.slice().reverse().forEach(rep => {
                const esResuelto = (rep.status === "resuelto" || rep.estado === "resuelto");
                const card = document.createElement("div");
                card.className = "reporte-card";

                const imagenEvidencia = rep.imagen_url ? `<div><span style="font-size:12px; color:var(--secundario);">Foto adjunta por el cliente:</span><br><img src="${rep.imagen_url}" class="img-evidencia-min" alt="Evidencia"></div>` : "";

                card.innerHTML = `
                    <div class="reporte-header">
                        <div>
                            <strong style="color:var(--verde); font-size:16px;">${rep.producto || rep.asunto || "Reporte de Producto"}</strong>
                            <div style="font-size:12px; color:var(--secundario); margin-top:2px;">Fecha: ${rep.fecha || "Reciente"} · Categoría: ${rep.categoria || "Garantía"}</div>
                        </div>
                        <span class="badge-estado ${esResuelto ? 'badge-resuelto' : 'badge-pendiente'}">
                            ${esResuelto ? '✓ Resuelto' : 'Pendiente'}
                        </span>
                    </div>

                    <div style="font-size:14px; line-height:1.6;">
                        ${rep.descripcion || "Sin descripción proporcionada."}
                    </div>

                    ${imagenEvidencia}

                    ${esResuelto 
                        ? `<div style="background:var(--input-fondo); padding:12px; border-left:3px solid var(--verde); font-size:13px; color:var(--texto);">
                                <strong>Solución otorgada:</strong> ${rep.solucion || 'Finalizado satisfactoriamente.'}
                           </div>` 
                        : `<button class="btn-resolver" onclick="irAResolver('${rep.id}', '${nitEmpresa}')">
                                Resolver Solicitud
                           </button>`
                    }
                `;
                contenedor.appendChild(card);
            });
        }

        function cerrarSesion() {
            localStorage.removeItem("empresa");
            window.location.href = "login.empresa.html";
        }

        document.addEventListener("DOMContentLoaded", () => {
            cargarReportes();
        });
    </script>
</body>

</html>

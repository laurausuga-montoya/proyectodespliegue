<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIGA | Confirmación de Pago</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tema.css">
    <script src="tema.js"></script>

    <style>
        :root {
            --fondo: #121212;
            --panel: #1b1b1b;
            --verde: #37E359;
            --texto: #f4f4f4;
            --secundario: #aaa;
            --borde: #2d2d2d;
            --input-fondo: #252525;
            --input-borde: #383838;
        }

        body.claro {
            --fondo: #f4f4f4;
            --panel: #ffffff;
            --texto: #111111;
            --secundario: #666666;
            --borde: #dddddd;
            --input-fondo: #f9f9f9;
            --input-borde: #cccccc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--fondo);
            color: var(--texto);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.3s, color 0.3s;
        }

        header {
            height: 75px;
            background: var(--panel);
            border-bottom: 1px solid var(--borde);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            transition: background 0.3s, border-color 0.3s;
        }

        .logo {
            color: var(--verde);
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            text-decoration: none;
        }

        main {
            width: 90%;
            max-width: 580px;
            margin: 40px auto;
        }

        .caja-pago {
            background: var(--panel);
            border: 1px solid var(--borde);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            transition: background 0.3s, border-color 0.3s;
        }

        .caja-pago h2 {
            font-size: 20px;
            color: var(--verde);
            margin-bottom: 8px;
        }

        .caja-pago p {
            font-size: 13px;
            color: var(--secundario);
            margin-bottom: 20px;
        }

        .metodos {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 22px;
        }

        .opcion-metodo {
            background: var(--input-fondo);
            border: 1px solid var(--input-borde);
            border-radius: 10px;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: .2s;
        }

        .opcion-metodo:hover {
            border-color: var(--verde);
        }

        .opcion-metodo input {
            accent-color: var(--verde);
        }

        .resumen-total {
            background: var(--fondo);
            border: 1px solid var(--borde);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 22px;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: 700;
        }

        .btn-finalizar {
            width: 100%;
            padding: 15px;
            background: var(--verde);
            color: #111;
            font-weight: 700;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: .2s;
        }

        .btn-finalizar:hover {
            filter: brightness(1.1);
        }

        .btn-finalizar:disabled {
            opacity: .6;
            cursor: wait;
        }
    </style>
</head>
<body>

<header>
    <a href="inicio.html" class="logo">VIGA</a>
    <a href="checkout.html" style="color:var(--texto); text-decoration:none; font-size:14px;">← Volver</a>
</header>

<main>
    <div class="caja-pago">
        <h2>Pasarela de Pago Segura</h2>
        <p>Selecciona el medio con el que deseas completar tu pedido.</p>

        <div class="metodos">
            <label class="opcion-metodo">
                <input type="radio" name="metodoPago" value="Tarjeta de Crédito / Débito" checked>
                <span>💳 Tarjeta de Crédito / Débito</span>
            </label>
            <label class="opcion-metodo">
                <input type="radio" name="metodoPago" value="Transferencia PSE / Bancolombia">
                <span>📱 PSE / Transferencia Bancolombia</span>
            </label>
            <label class="opcion-metodo">
                <input type="radio" name="metodoPago" value="Pago Contra Entrega">
                <span>📦 Contra Entrega (Efectivo al recibir)</span>
            </label>
        </div>

        <div class="resumen-total">
            <span>Monto Total:</span>
            <span style="color:var(--verde);" id="montoTotalTxt">$0</span>
        </div>

        <button class="btn-finalizar" id="btnConfirmarPago" onclick="procesarCompra()">
            Confirmar y Finalizar Pedido
        </button>
    </div>
</main>

<script>
    const API = "https://viga-c607.onrender.com";

    function sincronizarTema() {
        const tema = localStorage.getItem("vigaTema");
        if (tema === "claro") document.body.classList.add("claro");
        else document.body.classList.remove("claro");
    }
    sincronizarTema();

    const orden = JSON.parse(localStorage.getItem("viga_orden_temporal") || "null");

    function calcularTotal() {
        if (!orden || !orden.articulos || orden.articulos.length === 0) {
            window.location.replace("tienda.html");
            return;
        }

        const total = orden.articulos.reduce((acc, i) => acc + (i.precio * i.cantidad), 0);
        document.getElementById("montoTotalTxt").textContent = `$${total.toLocaleString('es-CO')}`;
    }

    async function procesarCompra() {
        const btn = document.getElementById("btnConfirmarPago");
        btn.disabled = true;
        btn.textContent = "Procesando orden y descontando inventario...";

        const metodoSeleccionado = document.querySelector('input[name="metodoPago"]:checked').value;

        const payload = {
            articulos: orden.articulos,
            cliente: orden.cliente,
            metodo_pago: metodoSeleccionado
        };

        try {
            const res = await fetch(`${API}/compras/procesar`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (!res.ok) throw new Error("Error procesando la compra en el servidor");

            // Limpiar carrito tras compra exitosa
            localStorage.removeItem("viga_carrito");
            localStorage.removeItem("viga_orden_temporal");

            alert("¡Compra procesada con éxito! El inventario ha sido actualizado.");
            window.location.replace("tienda.html");

        } catch (e) {
            alert("No se pudo completar el pedido. Intenta nuevamente.");
            btn.disabled = false;
            btn.textContent = "Confirmar y Finalizar Pedido";
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        sincronizarTema();
        calcularTotal();
    });
</script>

</body>
</html>

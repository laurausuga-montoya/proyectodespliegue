<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIGA | Tienda de Implementos Deportivos</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="tema.js"></script>

    <style>
        :root {
            --fondo: #121212;
            --panel: #1b1b1b;
            --verde: #37E359;
            --texto: #f4f4f4;
            --secundario: #aaa;
            --borde: #2d2d2d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--fondo);
            color: var(--texto);
            min-height: 100vh;
        }

        /* HEADER */
        header {
            height: 80px;
            background: var(--panel);
            border-bottom: 1px solid var(--borde);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            color: var(--verde);
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 2px;
            text-decoration: none;
        }

        .nav-derecha {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .volver {
            color: #ddd;
            text-decoration: none;
            transition: .2s;
            font-size: 14px;
        }

        .volver:hover {
            color: var(--verde);
        }

        .btn-carrito {
            position: relative;
            background: #252525;
            border: 1px solid var(--borde);
            color: white;
            padding: 10px 18px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: .2s;
        }

        .btn-carrito:hover {
            border-color: var(--verde);
            color: var(--verde);
        }

        .contador-carrito {
            background: var(--verde);
            color: #111;
            font-size: 11px;
            font-weight: 700;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* CONTENIDO PRINCIPAL */
        main {
            width: 90%;
            max-width: 1300px;
            margin: 40px auto;
        }

        .titulo-seccion {
            text-align: center;
            margin-bottom: 35px;
        }

        .titulo-seccion h1 {
            font-size: 36px;
            color: var(--verde);
            margin-bottom: 8px;
        }

        .titulo-seccion p {
            color: var(--secundario);
            font-size: 15px;
        }

        .filtros {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .filtro-btn {
            background: #252525;
            color: #ddd;
            border: 1px solid var(--borde);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: .2s;
        }

        .filtro-btn:hover, .filtro-btn.activo {
            background: var(--verde);
            color: #111;
            font-weight: 600;
            border-color: var(--verde);
        }

        .catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .tarjeta-producto {
            background: var(--panel);
            border: 1px solid var(--borde);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: .3s;
        }

        .tarjeta-producto:hover {
            transform: translateY(-5px);
            border-color: var(--verde);
        }

        .img-contenedor {
            width: 100%;
            height: 230px;
            background: #181818;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .img-contenedor img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .categoria-tag {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(18, 18, 18, 0.85);
            color: var(--verde);
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(55, 227, 89, 0.3);
        }

        .info-producto {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .info-producto h3 {
            font-size: 19px;
            margin-bottom: 8px;
            color: #fff;
        }

        .info-producto p {
            font-size: 13px;
            color: var(--secundario);
            line-height: 1.6;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .pie-tarjeta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 12px;
            border-top: 1px solid #292929;
        }

        .precio {
            font-size: 20px;
            font-weight: 700;
            color: var(--verde);
        }

        .stock-disponible {
            font-size: 12px;
            color: #888;
        }

        .btn-anadir {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background: var(--verde);
            color: #111;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
        }

        .btn-anadir:hover {
            filter: brightness(1.1);
        }

        .btn-anadir:disabled {
            background: #333;
            color: #777;
            cursor: not-allowed;
        }

        .vacio {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--secundario);
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--borde);
        }

        /* ================= MODAL / DRAWER CARRITO ================= */
        .carrito-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
            display: none;
            backdrop-filter: blur(3px);
        }

        .carrito-overlay.activo {
            display: block;
        }

        .carrito-panel {
            position: fixed;
            top: 0;
            right: -450px;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background: #181818;
            border-left: 1px solid var(--borde);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            transition: right .3s ease;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }

        .carrito-panel.activo {
            right: 0;
        }

        .carrito-header {
            padding: 20px 25px;
            border-bottom: 1px solid var(--borde);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .carrito-header h2 {
            font-size: 20px;
            color: var(--verde);
        }

        .btn-cerrar-carrito {
            background: #252525;
            border: none;
            color: white;
            font-size: 20px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
        }

        .btn-cerrar-carrito:hover {
            background: #333;
            color: var(--verde);
        }

        .carrito-items {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .item-carrito {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #202020;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #292929;
        }

        .item-carrito img {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 8px;
            background: #111;
        }

        .item-detalles {
            flex-grow: 1;
        }

        .item-detalles h4 {
            font-size: 14px;
            color: white;
            margin-bottom: 4px;
        }

        .item-detalles .item-precio {
            color: var(--verde);
            font-size: 13px;
            font-weight: 600;
        }

        .item-cantidad {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
        }

        .btn-cant {
            background: #2b2b2b;
            border: 1px solid #3b3b3b;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .btn-cant:hover {
            border-color: var(--verde);
            color: var(--verde);
        }

        .btn-eliminar-item {
            background: transparent;
            border: none;
            color: #ff9292;
            cursor: pointer;
            font-size: 18px;
            padding: 5px;
        }

        .btn-eliminar-item:hover {
            color: #ff5252;
        }

        .carrito-footer {
            padding: 20px 25px;
            border-top: 1px solid var(--borde);
            background: #141414;
        }

        .carrito-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            font-size: 16px;
        }

        .carrito-total strong {
            font-size: 22px;
            color: var(--verde);
        }

        .btn-finalizar {
            width: 100%;
            padding: 14px;
            background: var(--verde);
            color: #111;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
        }

        .btn-finalizar:hover {
            filter: brightness(1.1);
        }

        .carrito-vacio {
            text-align: center;
            padding: 40px 10px;
            color: var(--secundario);
            font-size: 14px;
        }

        @media (max-width: 700px) {
            header { padding: 0 20px; }
            .catalogo { grid-template-columns: 1fr; }
            .carrito-panel { max-width: 100%; }
        }
    </style>
</head>
<body>

<header>
    <a href="inicio.html" class="logo">VIGA</a>

    <div class="nav-derecha">
        <a href="inicio.html" class="volver">← Volver al inicio</a>
        <button class="btn-carrito" id="btnAbrirCarrito">
            🛒 Carrito <span class="contador-carrito" id="contadorCarrito">0</span>
        </button>
    </div>
</header>

<main>
    <div class="titulo-seccion">
        <h1>Tienda de Implementos Deportivos</h1>
        <p>Encuentra pesas, indumentaria y accesorios publicados por nuestras marcas aliadas.</p>
    </div>

    <!-- FILTROS POR CATEGORÍA -->
    <div class="filtros" id="contenedorFiltros">
        <button class="filtro-btn activo" onclick="filtrarCategoria('Todas', this)">Todas</button>
        <button class="filtro-btn" onclick="filtrarCategoria('Pesas y mancuernas', this)">Pesas y mancuernas</button>
        <button class="filtro-btn" onclick="filtrarCategoria('Máquinas', this)">Máquinas</button>
        <button class="filtro-btn" onclick="filtrarCategoria('Accesorios', this)">Accesorios</button>
        <button class="filtro-btn" onclick="filtrarCategoria('Ropa deportiva', this)">Ropa deportiva</button>
        <button class="filtro-btn" onclick="filtrarCategoria('Protección', this)">Protección</button>
    </div>

    <!-- GRILLA DE PRODUCTOS -->
    <div class="catalogo" id="grillaProductos">
        <div class="vacio">Cargando productos de las marcas aliadas...</div>
    </div>
</main>

<!-- MODAL / DRAWER LATERAL DEL CARRITO -->
<div class="carrito-overlay" id="carritoOverlay"></div>
<aside class="carrito-panel" id="carritoPanel">
    <div class="carrito-header">
        <h2>Mi Carrito de Compras</h2>
        <button class="btn-cerrar-carrito" id="btnCerrarCarrito">×</button>
    </div>

    <div class="carrito-items" id="carritoItems">
        <div class="carrito-vacio">El carrito está vacío.</div>
    </div>

    <div class="carrito-footer">
        <div class="carrito-total">
            <span>Total:</span>
            <strong id="totalCarrito">$ 0</strong>
        </div>
        <button class="btn-finalizar" onclick="procederPago()">Continuar al pago</button>
    </div>
</aside>

<script>
    const API = "https://viga-c607.onrender.com";
    let listaProductos = [];
    let carrito = JSON.parse(localStorage.getItem("viga_carrito") || "[]");

    function dinero(valor) {
        return Number(valor || 0).toLocaleString("es-CO", {
            style: "currency",
            currency: "COP",
            maximumFractionDigits: 0
        });
    }

    // Resuelve la URL real de la foto que subió la empresa
    function obtenerUrlImagen(urlGuardada) {
        if (!urlGuardada) {
            return "https://images.unsplash.com/photo-1584735935682-2f2b69dff9d2?auto=format&fit=crop&w=800&q=80";
        }
        if (urlGuardada.startsWith("http://") || urlGuardada.startsWith("https://")) {
            return urlGuardada;
        }
        // Si viene con ruta relativa del backend (/uploads/...)
        return `${API}${urlGuardada.startsWith("/") ? "" : "/"}${urlGuardada}`;
    }

    /* =========================================================
       CARGAR PRODUCTOS DESDE EL BACKEND
    ========================================================= */
    async function cargarTienda() {
        const contenedor = document.getElementById("grillaProductos");
        try {
            const res = await fetch(`${API}/productos`);
            if (!res.ok) throw new Error("No se pudo cargar el catálogo.");

            listaProductos = await res.json();
            renderizarCatalogo(listaProductos);
            actualizarInterfazCarrito();

        } catch (error) {
            contenedor.innerHTML = `<div class="vacio">No fue posible conectar con la tienda. ${error.message}</div>`;
        }
    }

    function renderizarCatalogo(productos) {
        const contenedor = document.getElementById("grillaProductos");
        contenedor.innerHTML = "";

        if (!productos || productos.length === 0) {
            contenedor.innerHTML = `<div class="vacio">Actualmente no hay productos disponibles en esta categoría.</div>`;
            return;
        }

        productos.forEach(prod => {
            const imagenSrc = obtenerUrlImagen(prod.imagen_url || prod.imagen_producto);
            const stockDisponible = Number(prod.stock || prod.stock_producto || 0);
            const precioProducto = Number(prod.precio || prod.precio_producto || 0);
            const nombreProducto = prod.nombre || prod.nombre_producto || "Producto";
            const descripcionProducto = prod.descripcion || prod.descripcion_producto || "";
            const categoriaProducto = prod.categoria || prod.categoria_producto || "Implemento";

            const tarjeta = document.createElement("div");
            tarjeta.className = "tarjeta-producto";

            tarjeta.innerHTML = `
                <div class="img-contenedor">
                    <span class="categoria-tag">${categoriaProducto}</span>
                    <img src="${imagenSrc}" alt="${nombreProducto}" loading="lazy">
                </div>
                <div class="info-producto">
                    <h3>${nombreProducto}</h3>
                    <p>${descripcionProducto}</p>
                    <div class="pie-tarjeta">
                        <div class="precio">${dinero(precioProducto)}</div>
                        <div class="stock-disponible">${stockDisponible} disponibles</div>
                    </div>
                    <button class="btn-anadir" ${stockDisponible <= 0 ? "disabled" : ""} onclick="agregarAlCarrito(${prod.id})">
                        ${stockDisponible > 0 ? "Añadir al carrito" : "Agotado"}
                    </button>
                </div>
            `;

            contenedor.appendChild(tarjeta);
        });
    }

    /* =========================================================
       LÓGICA DEL CARRITO
    ========================================================= */
    function agregarAlCarrito(idProducto) {
        const prod = listaProductos.find(p => p.id === idProducto);
        if (!prod) return;

        const existente = carrito.find(item => item.id === idProducto);
        const stockMax = Number(prod.stock || prod.stock_producto || 0);
        const imagenReal = obtenerUrlImagen(prod.imagen_url || prod.imagen_producto);
        const precioReal = Number(prod.precio || prod.precio_producto || 0);
        const nombreReal = prod.nombre || prod.nombre_producto || "Producto";

        if (existente) {
            if (existente.cantidad < stockMax) {
                existente.cantidad += 1;
            } else {
                alert("Has alcanzado el límite de existencias disponibles para este producto.");
                return;
            }
        } else {
            carrito.push({
                id: prod.id,
                nombre: nombreReal,
                precio: precioReal,
                imagen: imagenReal,
                stock: stockMax,
                cantidad: 1
            });
        }

        guardarCarrito();
        actualizarInterfazCarrito();
        abrirCarrito();
    }

    function cambiarCantidad(idProducto, cambio) {
        const item = carrito.find(p => p.id === idProducto);
        if (!item) return;

        item.cantidad += cambio;

        if (item.cantidad <= 0) {
            eliminarDelCarrito(idProducto);
            return;
        }

        if (item.cantidad > item.stock) {
            item.cantidad = item.stock;
            alert("No hay más unidades disponibles.");
        }

        guardarCarrito();
        actualizarInterfazCarrito();
    }

    function eliminarDelCarrito(idProducto) {
        carrito = carrito.filter(p => p.id !== idProducto);
        guardarCarrito();
        actualizarInterfazCarrito();
    }

    function guardarCarrito() {
        localStorage.setItem("viga_carrito", JSON.stringify(carrito));
    }

    function actualizarInterfazCarrito() {
        const totalItems = carrito.reduce((acc, item) => acc + item.cantidad, 0);
        document.getElementById("contadorCarrito").textContent = totalItems;

        const contenedorItems = document.getElementById("carritoItems");
        const totalTexto = document.getElementById("totalCarrito");

        if (carrito.length === 0) {
            contenedorItems.innerHTML = `<div class="carrito-vacio">El carrito está vacío.</div>`;
            totalTexto.textContent = "$ 0";
            return;
        }

        let sumaTotal = 0;
        contenedorItems.innerHTML = "";

        carrito.forEach(item => {
            const subtotal = item.precio * item.cantidad;
            sumaTotal += subtotal;

            const div = document.createElement("div");
            div.className = "item-carrito";
            div.innerHTML = `
                <img src="${item.imagen}" alt="${item.nombre}">
                <div class="item-detalles">
                    <h4>${item.nombre}</h4>
                    <div class="item-precio">${dinero(item.precio)}</div>
                    <div class="item-cantidad">
                        <button class="btn-cant" onclick="cambiarCantidad(${item.id}, -1)">-</button>
                        <span>${item.cantidad}</span>
                        <button class="btn-cant" onclick="cambiarCantidad(${item.id}, 1)">+</button>
                    </div>
                </div>
                <button class="btn-eliminar-item" onclick="eliminarDelCarrito(${item.id})" title="Eliminar">🗑️</button>
            `;
            contenedorItems.appendChild(div);
        });

        totalTexto.textContent = dinero(sumaTotal);
    }

    function abrirCarrito() {
        document.getElementById("carritoOverlay").classList.add("activo");
        document.getElementById("carritoPanel").classList.add("activo");
    }

    function cerrarCarrito() {
        document.getElementById("carritoOverlay").classList.remove("activo");
        document.getElementById("carritoPanel").classList.remove("activo");
    }

    document.getElementById("btnAbrirCarrito").addEventListener("click", abrirCarrito);
    document.getElementById("btnCerrarCarrito").addEventListener("click", cerrarCarrito);
    document.getElementById("carritoOverlay").addEventListener("click", cerrarCarrito);

    function filtrarCategoria(categoria, boton) {
        document.querySelectorAll(".filtro-btn").forEach(b => b.classList.remove("activo"));
        if (boton) boton.classList.add("activo");

        if (categoria === "Todas") {
            renderizarCatalogo(listaProductos);
        } else {
            const filtrados = listaProductos.filter(p => (p.categoria || p.categoria_producto) === categoria);
            renderizarCatalogo(filtrados);
        }
    }

    function procederPago() {
        if (carrito.length === 0) {
            alert("Agrega productos al carrito primero.");
            return;
        }
        alert("¡Pedido registrado! Se conectará con la pasarela de pago o el proveedor.");
    }

    document.addEventListener("DOMContentLoaded", cargarTienda);
</script>

</body>
</html>

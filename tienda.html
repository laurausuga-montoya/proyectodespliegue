<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIGA | Tienda de Implementos Deportivos</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="tema.js"></script>

    <style>
        :root {
            --fondo: #121212;
            --panel: #1b1b1b;
            --verde: #37E359;
            --texto: #f4f4f4;
            --secundario: #aaa;
            --borde: #2d2d2d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--fondo);
            color: var(--texto);
            min-height: 100vh;
        }

        header {
            height: 80px;
            background: var(--panel);
            border-bottom: 1px solid var(--borde);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 60px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            color: var(--verde);
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 2px;
            text-decoration: none;
        }

        .volver {
            color: #ddd;
            text-decoration: none;
            transition: .2s;
            font-size: 15px;
        }

        .volver:hover {
            color: var(--verde);
        }

        main {
            width: 90%;
            max-width: 1300px;
            margin: 40px auto;
        }

        .titulo-seccion {
            text-align: center;
            margin-bottom: 35px;
        }

        .titulo-seccion h1 {
            font-size: 36px;
            color: var(--verde);
            margin-bottom: 8px;
        }

        .titulo-seccion p {
            color: var(--secundario);
            font-size: 15px;
        }

        .filtros {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .filtro-btn {
            background: #252525;
            color: #ddd;
            border: 1px solid var(--borde);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: .2s;
        }

        .filtro-btn:hover, .filtro-btn.activo {
            background: var(--verde);
            color: #111;
            font-weight: 600;
            border-color: var(--verde);
        }

        .catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .tarjeta-producto {
            background: var(--panel);
            border: 1px solid var(--borde);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: .3s;
        }

        .tarjeta-producto:hover {
            transform: translateY(-5px);
            border-color: var(--verde);
        }

        .img-contenedor {
            width: 100%;
            height: 220px;
            background: #222;
            overflow: hidden;
            position: relative;
        }

        .img-contenedor img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .categoria-tag {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(18, 18, 18, 0.85);
            color: var(--verde);
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(55, 227, 89, 0.3);
        }

        .info-producto {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .info-producto h3 {
            font-size: 19px;
            margin-bottom: 8px;
            color: #fff;
        }

        .info-producto p {
            font-size: 13px;
            color: var(--secundario);
            line-height: 1.6;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .pie-tarjeta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 12px;
            border-top: 1px solid #292929;
        }

        .precio {
            font-size: 20px;
            font-weight: 700;
            color: var(--verde);
        }

        .stock-disponible {
            font-size: 12px;
            color: #888;
        }

        .btn-comprar {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background: var(--verde);
            color: #111;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
        }

        .btn-comprar:hover {
            filter: brightness(1.1);
        }

        .vacio {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--secundario);
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--borde);
        }

        @media (max-width: 700px) {
            header { padding: 0 20px; }
            .catalogo { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header>
    <a href="inicio.html" class="logo">VIGA</a>
    <a href="inicio.html" class="volver">← Volver al inicio</a>
</header>

<main>
    <div class="titulo-seccion">
        <h1>Tienda de Implementos Deportivos</h1>
        <p>Encuentra pesas, indumentaria y accesorios publicados por nuestras marcas aliadas.</p>
    </div>

    <!-- FILTROS POR CATEGORÍA -->
    <div class="filtros" id="contenedorFiltros">
        <button class="filtro-btn activo" onclick="filtrarCategoria('Todas', this)">Todas</button>
        <button class="filtro-btn" onclick="filtrarCategoria('Pesas y mancuernas', this)">Pesas y mancuernas</button>
        <button class="filtro-btn" onclick="filtrarCategoria('Máquinas', this)">Máquinas</button>
        <button class="filtro-btn" onclick="filtrarCategoria('Accesorios', this)">Accesorios</button>
        <button class="filtro-btn" onclick="filtrarCategoria('Ropa deportiva', this)">Ropa deportiva</button>
        <button class="filtro-btn" onclick="filtrarCategoria('Protección', this)">Protección</button>
    </div>

    <!-- GRILLA DE PRODUCTOS -->
    <div class="catalogo" id="grillaProductos">
        <div class="vacio">Cargando productos de las marcas aliadas...</div>
    </div>
</main>

<script>
    const API = "https://viga-c607.onrender.com";
    let listaProductos = [];

    function dinero(valor) {
        return Number(valor || 0).toLocaleString("es-CO", {
            style: "currency",
            currency: "COP",
            maximumFractionDigits: 0
        });
    }

    async function cargarTienda() {
        const contenedor = document.getElementById("grillaProductos");
        try {
            // Llama a la ruta pública del backend
            const res = await fetch(`${API}/productos`);
            if (!res.ok) throw new Error("No se pudo cargar el catálogo.");

            listaProductos = await res.json();
            renderizarCatalogo(listaProductos);

        } catch (error) {
            contenedor.innerHTML = `<div class="vacio">No fue posible conectar con la tienda. ${error.message}</div>`;
        }
    }

    function renderizarCatalogo(productos) {
        const contenedor = document.getElementById("grillaProductos");
        contenedor.innerHTML = "";

        if (!productos || productos.length === 0) {
            contenedor.innerHTML = `<div class="vacio">Actualmente no hay productos disponibles en esta categoría.</div>`;
            return;
        }

        productos.forEach(prod => {
            // Resuelve la URL de la imagen (ruta relativa del backend o fallback)
            const imagenSrc = prod.imagen_url 
                ? (prod.imagen_url.startsWith("http") ? prod.imagen_url : `${API}${prod.imagen_url}`)
                : "https://images.unsplash.com/photo-1584735935682-2f2b69dff9d2?auto=format&fit=crop&w=800&q=80";

            const tarjeta = document.createElement("div");
            tarjeta.className = "tarjeta-producto";

            tarjeta.innerHTML = `
                <div class="img-contenedor">
                    <span class="categoria-tag">${prod.categoria || "Implemento"}</span>
                    <img src="${imagenSrc}" alt="${prod.nombre}" onerror="this.src='https://images.unsplash.com/photo-1584735935682-2f2b69dff9d2?auto=format&fit=crop&w=800&q=80'">
                </div>
                <div class="info-producto">
                    <h3>${prod.nombre}</h3>
                    <p>${prod.descripcion}</p>
                    <div class="pie-tarjeta">
                        <div class="precio">${dinero(prod.precio)}</div>
                        <div class="stock-disponible">${prod.stock} disp.</div>
                    </div>
                    <button class="btn-comprar" onclick="contactarEmpresa('${prod.nombre}')">Ver detalles / Contactar</button>
                </div>
            `;

            contenedor.appendChild(tarjeta);
        });
    }

    function filtrarCategoria(categoria, boton) {
        document.querySelectorAll(".filtro-btn").forEach(b => b.classList.remove("activo"));
        if (boton) boton.classList.add("activo");

        if (categoria === "Todas") {
            renderizarCatalogo(listaProductos);
        } else {
            const filtrados = listaProductos.filter(p => p.categoria === categoria);
            renderizarCatalogo(filtrados);
        }
    }

    function contactarEmpresa(nombreProducto) {
        alert(`Para adquirir o consultar sobre "${nombreProducto}", comunícate con la empresa proveedora a través de VIGA.`);
    }

    document.addEventListener("DOMContentLoaded", cargarTienda);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIGA | Tienda Deportiva</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tema.css">
    <script src="tema.js"></script>

    <style>
        :root {
            --fondo: #121212;
            --panel: #1b1b1b;
            --verde: #37E359;
            --texto: #f4f4f4;
            --secundario: #aaa;
            --borde: #2d2d2d;
            --card-fondo: #181818;
            --badge-fondo: #233827;
            --badge-texto: #37E359;
        }

        body.claro {
            --fondo: #f4f4f4;
            --panel: #ffffff;
            --texto: #111111;
            --secundario: #666666;
            --borde: #dddddd;
            --card-fondo: #ffffff;
            --badge-fondo: #daf5de;
            --badge-texto: #12822a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--fondo);
            color: var(--texto);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        header {
            height: 75px;
            background: var(--panel);
            border-bottom: 1px solid var(--borde);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            position: sticky;
            top: 0;
            z-index: 100;
            transition: background 0.3s, border-color 0.3s;
        }

        .logo {
            color: var(--verde);
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            text-decoration: none;
        }

        .acciones-header {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-header {
            color: var(--texto);
            text-decoration: none;
            font-size: 13px;
            background: var(--panel);
            border: 1px solid var(--borde);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: .2s;
            position: relative;
        }

        .btn-header:hover {
            color: var(--verde);
            border-color: var(--verde);
        }

        .badge-carrito {
            position: absolute;
            top: -6px;
            right: -6px;
            background: var(--verde);
            color: #111;
            font-size: 11px;
            font-weight: 700;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        main {
            width: 90%;
            max-width: 1100px;
            margin: 35px auto;
        }

        .hero-tienda {
            background: var(--panel);
            border: 1px solid var(--borde);
            border-radius: 16px;
            padding: 25px 30px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
            transition: background 0.3s, border-color 0.3s;
        }

        .hero-tienda h1 {
            font-size: 26px;
            color: var(--texto);
        }

        .hero-tienda p {
            font-size: 13px;
            color: var(--secundario);
            margin-top: 4px;
        }

        .catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 22px;
        }

        .tarjeta-prod {
            background: var(--card-fondo);
            border: 1px solid var(--borde);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform .2s, border-color .2s;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .tarjeta-prod:hover {
            transform: translateY(-4px);
            border-color: var(--verde);
        }

        .img-prod {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #202020;
        }

        .info-prod {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .categoria-tag {
            background: var(--badge-fondo);
            color: var(--badge-texto);
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            align-self: flex-start;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .nombre-prod {
            font-size: 16px;
            color: var(--texto);
            font-weight: 600;
            margin-bottom: 6px;
        }

        .desc-prod {
            font-size: 12px;
            color: var(--secundario);
            line-height: 1.5;
            margin-bottom: 12px;
            flex-grow: 1;
        }

        .precio-stock {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .precio-txt {
            font-size: 18px;
            font-weight: 700;
            color: var(--verde);
        }

        .stock-txt {
            font-size: 11px;
            color: var(--secundario);
        }

        .btn-comprar {
            width: 100%;
            padding: 12px;
            background: var(--verde);
            color: #111;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: .2s;
        }

        .btn-comprar:hover {
            filter: brightness(1.1);
        }

        .btn-agotado {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }

        @media (max-width: 650px) {
            header { padding: 0 20px; }
            .hero-tienda { padding: 20px; }
        }
    </style>
</head>
<body>

<header>
    <a href="inicio.html" class="logo">VIGA</a>
    <div class="acciones-header">
        <a href="checkout.html" class="btn-header">
            🛒 Carrito <span id="contadorCarrito" class="badge-carrito">0</span>
        </a>
        <a href="inicio.html" class="btn-header">← Inicio</a>
    </div>
</header>

<main>
    <div class="hero-tienda">
        <div>
            <h1>Tienda Oficial VIGA</h1>
            <p>Implementos, nutrición y accesorios deportivos certificados para tu entrenamiento.</p>
        </div>
    </div>

    <div class="catalogo" id="grillaProductos">
        <p style="color:var(--secundario); text-align:center; grid-column:1/-1;">Cargando catálogo oficial...</p>
    </div>
</main>

<script>
    const API = "https://viga-c607.onrender.com";

    function sincronizarTema() {
        const tema = localStorage.getItem("vigaTema");
        if (tema === "claro") document.body.classList.add("claro");
        else document.body.classList.remove("claro");
    }
    sincronizarTema();

    let carrito = JSON.parse(localStorage.getItem("viga_carrito") || "[]");

    function actualizarContador() {
        const total = carrito.reduce((acc, item) => acc + item.cantidad, 0);
        document.getElementById("contadorCarrito").textContent = total;
    }

    async function cargarCatalogo() {
        try {
            const res = await fetch(`${API}/productos?t=${Date.now()}`);
            if (!res.ok) throw new Error("No se pudo cargar la tienda");
            const prods = await res.json();

            const grilla = document.getElementById("grillaProductos");
            grilla.innerHTML = "";

            if (!prods || prods.length === 0) {
                grilla.innerHTML = `<p style="grid-column:1/-1; color:var(--secundario); text-align:center; padding:50px;">No hay productos disponibles por ahora.</p>`;
                return;
            }

            prods.forEach(p => {
                const stockValido = p.stock > 0;
                const imagen = p.imagen_url ? (p.imagen_url.startsWith("http") ? p.imagen_url : `${API}${p.imagen_url}`) : "https://images.unsplash.com/photo-1584735935682-2f2b69dff9d2?auto=format&fit=crop&w=600&q=80";

                const card = document.createElement("div");
                card.className = "tarjeta-prod";
                card.innerHTML = `
                    <img class="img-prod" src="${imagen}" alt="${p.nombre}">
                    <div class="info-prod">
                        <span class="categoria-tag">${p.categoria || 'Accesorio'}</span>
                        <h3 class="nombre-prod">${p.nombre}</h3>
                        <p class="desc-prod">${p.descripcion || 'Producto oficial de entrenamiento VIGA.'}</p>
                        <div class="precio-stock">
                            <span class="precio-txt">$${Number(p.precio).toLocaleString('es-CO')}</span>
                            <span class="stock-txt">${stockValido ? `Stock: ${p.stock}` : 'Agotado'}</span>
                        </div>
                        <button class="btn-comprar ${!stockValido ? 'btn-agotado' : ''}" 
                                onclick='agregarAlCarrito(${JSON.stringify(p)})' 
                                ${!stockValido ? 'disabled' : ''}>
                            ${stockValido ? 'Agregar al Carrito' : 'Sin Unidades'}
                        </button>
                    </div>
                `;
                grilla.appendChild(card);
            });

        } catch (e) {
            document.getElementById("grillaProductos").innerHTML = `<p style="grid-column:1/-1; color:#ff5252; text-align:center;">Error al conectar con la tienda.</p>`;
        }
    }

    function agregarAlCarrito(producto) {
        const itemExistente = carrito.find(x => x.id === producto.id);
        if (itemExistente) {
            if (itemExistente.cantidad < producto.stock) {
                itemExistente.cantidad += 1;
            } else {
                alert("Has alcanzado el stock máximo disponible para este artículo.");
                return;
            }
        } else {
            carrito.push({
                id: producto.id,
                nombre: producto.nombre,
                precio: Number(producto.precio),
                cantidad: 1,
                stock: producto.stock,
                imagen_url: producto.imagen_url
            });
        }

        localStorage.setItem("viga_carrito", JSON.stringify(carrito));
        actualizarContador();
    }

    document.addEventListener("DOMContentLoaded", () => {
        sincronizarTema();
        actualizarContador();
        cargarCatalogo();
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VIGA | Checkout</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Poppins", sans-serif;
            background: linear-gradient(rgba(10, 10, 10, 0.93), rgba(10, 10, 10, 0.97));
            color: white;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        /* ================================
           HEADER
        ================================= */
        header {
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            background: #111;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .volver {
            color: white;
            text-decoration: none;
            font-size: 28px;
            cursor: pointer;
            transition: 0.2s;
        }

        .volver:hover {
            color: #37e359;
            transform: translateX(-3px);
        }

        .logo {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #37e359;
        }

        .espacio {
            width: 30px;
        }

        /* ================================
           CONTENEDOR
        ================================= */
        .contenedor {
            width: 90%;
            max-width: 1000px;
            margin: 45px auto;
        }

        .titulo {
            text-align: center;
            margin-bottom: 10px;
            font-size: 32px;
            font-weight: 700;
        }

        .subtitulo {
            text-align: center;
            color: #aaa;
            margin-bottom: 35px;
            font-size: 14px;
        }

        /* ================================
           SECCIONES CHECKOUT
        ================================= */
        .grid-checkout {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 25px;
        }

        .tarjeta {
            background: #181818;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 0px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
        }

        .tarjeta h2 {
            font-size: 19px;
            margin-bottom: 15px;
            color: white;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 10px;
        }

        /* LISTA CARRITO */
        .lista-articulos {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 15px;
        }

        .item-fila {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #101010;
            border: 1px solid #282828;
            padding: 12px 16px;
        }

        .item-info h4 {
            font-size: 15px;
            color: white;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .item-info span {
            font-size: 13px;
            color: #37e359;
            font-weight: 600;
        }

        .item-controles {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-qty {
            background: #252525;
            border: 1px solid #383838;
            color: white;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .btn-qty:hover {
            border-color: #37e359;
            color: #37e359;
        }

        .btn-del {
            background: transparent;
            border: none;
            color: #ff5252;
            cursor: pointer;
            font-size: 14px;
            padding-left: 6px;
        }

        /* FORMULARIO DE ENVÍO */
        .campo {
            margin-bottom: 15px;
        }

        .campo label {
            display: block;
            margin-bottom: 7px;
            color: #ccc;
            font-size: 13px;
        }

        .campo input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 0px;
            border: 1px solid #333;
            background: #101010;
            color: white;
            outline: none;
            font-family: inherit;
            font-size: 14px;
            transition: 0.2s;
        }

        .campo input:focus {
            border-color: #37e359;
        }

        .total-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 25px 0 20px 0;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 15px;
            font-size: 18px;
            font-weight: 700;
        }

        .total-valor {
            color: #37e359;
            font-size: 22px;
        }

        .boton-pagar {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 0px;
            background: #37e359;
            color: #071009;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .boton-pagar:hover:not(:disabled) {
            background: #2fd04f;
            transform: scale(1.01);
        }

        .boton-pagar:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }

        /* ================================
           TEMA CLARO
        ================================= */
        body.claro {
            background: #f3f3f3;
            color: #111;
        }

        body.claro header {
            background: white;
            border-bottom: 1px solid #ddd;
        }

        body.claro .volver,
        body.claro .titulo,
        body.claro .tarjeta h2,
        body.claro .item-info h4 {
            color: #111;
        }

        body.claro .subtitulo {
            color: #666;
        }

        body.claro .tarjeta {
            background: white;
            border: 1px solid #ddd;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        body.claro .item-fila {
            background: #f9f9f9;
            border-color: #e0e0e0;
        }

        body.claro .btn-qty {
            background: #ececec;
            border-color: #d0d0d0;
            color: #111;
        }

        body.claro .campo label {
            color: #333;
        }

        body.claro .campo input {
            background: #f7f7f7;
            color: #111;
            border-color: #ddd;
        }

        body.claro .total-box {
            border-color: #eee;
            color: #111;
        }

        @media (max-width: 750px) {
            header { padding: 0 20px; }
            .grid-checkout { grid-template-columns: 1fr; }
            .contenedor { width: 92%; margin-top: 30px; }
        }

    </style>

    <link rel="stylesheet" href="tema.css">
    <script src="tema.js"></script>

</head>

<body>

    <header>
        <a href="tienda.html" class="volver">←</a>
        <div class="logo">VIGA</div>
        <div class="espacio"></div>
    </header>

    <main class="contenedor">

        <h1 class="titulo">Carrito de Compras</h1>
        <p class="subtitulo">Verifica tus artículos y completa los datos de entrega</p>

        <div class="grid-checkout">

            <!-- ARTÍCULOS -->
            <div class="tarjeta">
                <h2>Tus Productos</h2>
                <div class="lista-articulos" id="contenedorArticulos"></div>
            </div>

            <!-- ENVÍO Y RESUMEN -->
            <div class="tarjeta">
                <h2>Información de Envío</h2>
                <form id="formularioCheckout">
                    <div class="campo">
                        <label for="clienteNombre">Nombre completo</label>
                        <input type="text" id="clienteNombre" placeholder="Tu nombre" required>
                    </div>

                    <div class="campo">
                        <label for="clienteCiudad">Ciudad de envío</label>
                        <input type="text" id="clienteCiudad" placeholder="Ej. Medellín, Bogotá" required>
                    </div>

                    <div class="campo">
                        <label for="clienteTelefono">Teléfono de contacto</label>
                        <input type="tel" id="clienteTelefono" placeholder="Número celular" required>
                    </div>

                    <div class="total-box">
                        <span>Total:</span>
                        <span class="total-valor" id="totalPagar">$0</span>
                    </div>

                    <button type="submit" class="boton-pagar" id="btnContinuarPago">
                        Continuar al Pago
                    </button>
                </form>
            </div>

        </div>

    </main>

    <script>
        function sincronizarTema() {
            const tema = localStorage.getItem("vigaTema");
            if (tema === "claro") {
                document.body.classList.add("claro");
            } else {
                document.body.classList.remove("claro");
            }
        }
        sincronizarTema();

        let carrito = JSON.parse(localStorage.getItem("viga_carrito") || "[]");

        function renderizarCarrito() {
            const contenedor = document.getElementById("contenedorArticulos");
            contenedor.innerHTML = "";

            if (carrito.length === 0) {
                contenedor.innerHTML = `<p style="color:#888; text-align:center; padding:30px 0;">Tu carrito está vacío.</p>`;
                document.getElementById("totalPagar").textContent = "$0";
                document.getElementById("btnContinuarPago").disabled = true;
                return;
            }

            let total = 0;

            carrito.forEach((item, index) => {
                const subtotal = item.precio * item.cantidad;
                total += subtotal;

                const div = document.createElement("div");
                div.className = "item-fila";
                div.innerHTML = `
                    <div class="item-info">
                        <h4>${item.nombre}</h4>
                        <span>$${Number(item.precio).toLocaleString('es-CO')}</span>
                    </div>
                    <div class="item-controles">
                        <button type="button" class="btn-qty" onclick="ajustarCantidad(${index}, -1)">-</button>
                        <span style="font-weight:600; font-size:14px;">${item.cantidad}</span>
                        <button type="button" class="btn-qty" onclick="ajustarCantidad(${index}, 1)">+</button>
                        <button type="button" class="btn-del" onclick="removerArticulo(${index})">✕</button>
                    </div>
                `;
                contenedor.appendChild(div);
            });

            document.getElementById("totalPagar").textContent = `$${total.toLocaleString('es-CO')}`;
            document.getElementById("btnContinuarPago").disabled = false;
        }

        function ajustarCantidad(indice, cambio) {
            const stockMaximo = parseInt(carrito[indice].stock, 10);
            
            // Permite sumar hasta llegar al stock real sin alertas
            if (cambio > 0 && carrito[indice].cantidad >= stockMaximo) {
                return;
            }

            carrito[indice].cantidad += cambio;

            if (carrito[indice].cantidad <= 0) {
                carrito.splice(indice, 1);
            }

            localStorage.setItem("viga_carrito", JSON.stringify(carrito));
            renderizarCarrito();
        }

        function removerArticulo(indice) {
            carrito.splice(indice, 1);
            localStorage.setItem("viga_carrito", JSON.stringify(carrito));
            renderizarCarrito();
        }

        document.getElementById("formularioCheckout").addEventListener("submit", function(e) {
            e.preventDefault();

            if (carrito.length === 0) return;

            const ordenTemporal = {
                articulos: carrito,
                cliente: {
                    nombre: document.getElementById("clienteNombre").value.trim(),
                    ciudad: document.getElementById("clienteCiudad").value.trim(),
                    telefono: document.getElementById("clienteTelefono").value.trim()
                }
            };

            localStorage.setItem("viga_orden_temporal", JSON.stringify(ordenTemporal));
            window.location.href = "pago.html";
        });

        document.addEventListener("DOMContentLoaded", () => {
            sincronizarTema();
            renderizarCarrito();
        });
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIGA | Carrito y Resumen de Orden</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tema.css">
    <script src="tema.js"></script>

    <style>
        :root {
            --fondo: #121212;
            --panel: #1b1b1b;
            --verde: #37E359;
            --texto: #f4f4f4;
            --secundario: #aaa;
            --borde: #2d2d2d;
            --fila-fondo: #171717;
            --input-fondo: #252525;
            --input-borde: #383838;
        }

        body.claro {
            --fondo: #f4f4f4;
            --panel: #ffffff;
            --texto: #111111;
            --secundario: #666666;
            --borde: #dddddd;
            --fila-fondo: #fafafa;
            --input-fondo: #f9f9f9;
            --input-borde: #cccccc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--fondo);
            color: var(--texto);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        header {
            height: 75px;
            background: var(--panel);
            border-bottom: 1px solid var(--borde);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            position: sticky;
            top: 0;
            z-index: 100;
            transition: background 0.3s, border-color 0.3s;
        }

        .logo {
            color: var(--verde);
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            text-decoration: none;
        }

        .volver {
            color: var(--texto);
            text-decoration: none;
            font-size: 14px;
            transition: .2s;
        }

        .volver:hover {
            color: var(--verde);
        }

        main {
            width: 90%;
            max-width: 960px;
            margin: 35px auto;
        }

        .contenedor-checkout {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 25px;
        }

        .panel-caja {
            background: var(--panel);
            border: 1px solid var(--borde);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
            transition: background 0.3s, border-color 0.3s;
        }

        .panel-caja h2 {
            font-size: 18px;
            color: var(--verde);
            border-bottom: 1px solid var(--borde);
            padding-bottom: 12px;
            margin-bottom: 18px;
        }

        .lista-items {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .item-carrito {
            background: var(--fila-fondo);
            border: 1px solid var(--borde);
            border-radius: 10px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-datos h4 {
            font-size: 15px;
            color: var(--texto);
            margin-bottom: 4px;
        }

        .item-datos span {
            font-size: 12px;
            color: var(--secundario);
        }

        .item-acciones {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-qty {
            background: var(--input-fondo);
            border: 1px solid var(--input-borde);
            color: var(--texto);
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
        }

        .btn-eliminar {
            background: transparent;
            border: none;
            color: #ff5252;
            cursor: pointer;
            font-size: 13px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        .campo label {
            font-size: 12px;
            color: var(--secundario);
        }

        .campo input {
            padding: 11px;
            background: var(--input-fondo);
            border: 1px solid var(--input-borde);
            border-radius: 8px;
            color: var(--texto);
            outline: none;
            font-size: 13px;
        }

        .campo input:focus {
            border-color: var(--verde);
        }

        .fila-total {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 700;
            margin: 20px 0;
            color: var(--texto);
        }

        .btn-pagar {
            width: 100%;
            padding: 14px;
            background: var(--verde);
            color: #111;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            transition: .2s;
        }

        .btn-pagar:hover {
            filter: brightness(1.1);
        }

        @media (max-width: 750px) {
            .contenedor-checkout { grid-template-columns: 1fr; }
            header { padding: 0 20px; }
        }
    </style>
</head>
<body>

<header>
    <a href="inicio.html" class="logo">VIGA</a>
    <a href="tienda.html" class="volver">← Volver a la Tienda</a>
</header>

<main>
    <div class="contenedor-checkout">
        
        <!-- LISTA DE PRODUCTOS -->
        <div class="panel-caja">
            <h2>Tus Artículos Seleccionados</h2>
            <div class="lista-items" id="contenedorItems"></div>
        </div>

        <!-- FORMULARIO DE ENVÍO Y PAGO -->
        <div class="panel-caja">
            <h2>Datos de Envío</h2>
            <form id="formCheckout">
                <div class="campo">
                    <label for="clienteNombre">Nombre completo *</label>
                    <input type="text" id="clienteNombre" placeholder="Tu nombre" required>
                </div>

                <div class="campo">
                    <label for="clienteCiudad">Ciudad de entrega *</label>
                    <input type="text" id="clienteCiudad" placeholder="Ej. Medellín, Bogotá" required>
                </div>

                <div class="campo">
                    <label for="clienteTelefono">Teléfono de contacto *</label>
                    <input type="tel" id="clienteTelefono" placeholder="Número celular" required>
                </div>

                <div class="fila-total">
                    <span>Total a Pagar:</span>
                    <span style="color:var(--verde);" id="totalPagarTxt">$0</span>
                </div>

                <button type="submit" class="btn-pagar" id="btnContinuar">Proceder al Pago</button>
            </form>
        </div>

    </div>
</main>

<script>
    function sincronizarTema() {
        const tema = localStorage.getItem("vigaTema");
        if (tema === "claro") document.body.classList.add("claro");
        else document.body.classList.remove("claro");
    }
    sincronizarTema();

    let carrito = JSON.parse(localStorage.getItem("viga_carrito") || "[]");

    function renderizarItems() {
        const contenedor = document.getElementById("contenedorItems");
        contenedor.innerHTML = "";

        if (carrito.length === 0) {
            contenedor.innerHTML = `<p style="color:var(--secundario); padding:20px 0;">Tu carrito está vacío.</p>`;
            document.getElementById("totalPagarTxt").textContent = "$0";
            document.getElementById("btnContinuar").disabled = true;
            return;
        }

        let total = 0;

        carrito.forEach((item, index) => {
            const subtotal = item.precio * item.cantidad;
            total += subtotal;

            const div = document.createElement("div");
            div.className = "item-carrito";
            div.innerHTML = `
                <div class="item-datos">
                    <h4>${item.nombre}</h4>
                    <span>$${item.precio.toLocaleString('es-CO')} c/u</span>
                </div>
                <div class="item-acciones">
                    <button class="btn-qty" onclick="modificarCantidad(${index}, -1)">-</button>
                    <span style="font-size:13px; font-weight:600;">${item.cantidad}</span>
                    <button class="btn-qty" onclick="modificarCantidad(${index}, 1)">+</button>
                    <button class="btn-eliminar" onclick="eliminarItem(${index})">✕</button>
                </div>
            `;
            contenedor.appendChild(div);
        });

        document.getElementById("totalPagarTxt").textContent = `$${total.toLocaleString('es-CO')}`;
        document.getElementById("btnContinuar").disabled = false;
    }

    function modificarCantidad(idx, cambio) {
        if (cambio > 0 && carrito[idx].cantidad >= carrito[idx].stock) {
            alert("No hay más unidades en stock.");
            return;
        }
        carrito[idx].cantidad += cambio;
        if (carrito[idx].cantidad <= 0) {
            carrito.splice(idx, 1);
        }
        localStorage.setItem("viga_carrito", JSON.stringify(carrito));
        renderizarItems();
    }

    function eliminarItem(idx) {
        carrito.splice(idx, 1);
        localStorage.setItem("viga_carrito", JSON.stringify(carrito));
        renderizarItems();
    }

    document.getElementById("formCheckout").addEventListener("submit", function(e) {
        e.preventDefault();
        const orden = {
            articulos: carrito,
            cliente: {
                nombre: document.getElementById("clienteNombre").value.trim(),
                ciudad: document.getElementById("clienteCiudad").value.trim(),
                telefono: document.getElementById("clienteTelefono").value.trim()
            }
        };
        localStorage.setItem("viga_orden_temporal", JSON.stringify(orden));
        window.location.href = "pago.html";
    });

    document.addEventListener("DOMContentLoaded", () => {
        sincronizarTema();
        renderizarItems();
    });
</script>

</body>
</html>

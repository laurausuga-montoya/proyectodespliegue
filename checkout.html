<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIGA | Checkout</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tema.css">
    <script src="tema.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Poppins", sans-serif;
            background: linear-gradient(rgba(10, 10, 10, 0.93), rgba(10, 10, 10, 0.97));
            color: white;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        header {
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            background: #111;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .volver {
            color: white;
            text-decoration: none;
            font-size: 28px;
            cursor: pointer;
            transition: 0.2s;
        }

        .volver:hover {
            color: #37e359;
            transform: translateX(-3px);
        }

        .logo {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #37e359;
        }

        .espacio {
            width: 30px;
        }

        .contenedor {
            width: 90%;
            max-width: 1000px;
            margin: 45px auto;
        }

        .titulo {
            text-align: center;
            margin-bottom: 10px;
            font-size: 32px;
            font-weight: 700;
            color: #37e359;
        }

        .subtitulo {
            text-align: center;
            color: #aaa;
            margin-bottom: 35px;
            font-size: 14px;
        }

        .grid-checkout {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 25px;
        }

        .tarjeta {
            background: #181818;
            border: 1px solid rgba(255,255,255,0.08);
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
        }

        .tarjeta h2 {
            font-size: 19px;
            margin-bottom: 15px;
            color: white;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 10px;
        }

        .lista-articulos {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 15px;
            max-height: 300px;
            overflow-y: auto;
        }

        .item-fila {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #101010;
            border: 1px solid #282828;
            padding: 12px 16px;
        }

        .item-info h4 {
            font-size: 15px;
            color: white;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .item-info span {
            font-size: 13px;
            color: #37e359;
            font-weight: 600;
        }

        .item-controles {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-qty {
            background: #252525;
            border: 1px solid #383838;
            color: white;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .btn-qty:hover {
            border-color: #37e359;
            color: #37e359;
        }

        .btn-del {
            background: transparent;
            border: none;
            color: #ff5252;
            cursor: pointer;
            font-size: 14px;
        }

        .campo {
            margin-bottom: 15px;
        }

        .campo label {
            display: block;
            margin-bottom: 7px;
            color: #ccc;
            font-size: 13px;
        }

        .campo input, .campo select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #333;
            background: #101010;
            color: white;
            outline: none;
            font-family: inherit;
            font-size: 14px;
            transition: 0.2s;
        }

        .campo input:focus, .campo select:focus {
            border-color: #37e359;
        }

        .caja-detalles-pago {
            background: #121914;
            border: 1px dashed #2d5535;
            padding: 18px;
            margin: 15px 0;
            border-radius: 0px;
        }

        .caja-detalles-pago h3 {
            font-size: 15px;
            color: #37e359;
            margin-bottom: 12px;
        }

        .fila-doble {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .total-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 25px 0 20px 0;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 15px;
            font-size: 18px;
            font-weight: 700;
        }

        .total-valor {
            color: #37e359;
            font-size: 22px;
        }

        .boton-pagar {
            width: 100%;
            padding: 14px;
            border: none;
            background: #37e359;
            color: #071009;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .boton-pagar:hover:not(:disabled) {
            background: #2fd04f;
            transform: scale(1.01);
        }

        .boton-pagar:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }

        /* TEMA CLARO */
        body.claro {
            background: #f3f3f3;
            color: #111;
        }

        body.claro header {
            background: white;
            border-bottom: 1px solid #ddd;
        }

        body.claro .volver,
        body.claro .tarjeta h2,
        body.claro .item-info h4 {
            color: #111;
        }

        body.claro .subtitulo {
            color: #666;
        }

        body.claro .tarjeta {
            background: white;
            border: 1px solid #ddd;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        body.claro .item-fila {
            background: #f9f9f9;
            border-color: #e0e0e0;
        }

        body.claro .btn-qty {
            background: #ececec;
            border-color: #d0d0d0;
            color: #111;
        }

        body.claro .campo label {
            color: #333;
        }

        body.claro .campo input, body.claro .campo select {
            background: #f7f7f7;
            color: #111;
            border-color: #ddd;
        }

        body.claro .caja-detalles-pago {
            background: #f0fdf4;
            border-color: #86efac;
        }

        body.claro .total-box {
            border-color: #eee;
            color: #111;
        }

        @media (max-width: 750px) {
            header { padding: 0 20px; }
            .grid-checkout { grid-template-columns: 1fr; }
            .contenedor { width: 92%; margin-top: 30px; }
            .fila-doble { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>

    <header>
        <a href="tienda.html" class="volver">←</a>
        <div class="logo">VIGA</div>
        <div class="espacio"></div>
    </header>

    <main class="contenedor">
        <h1 class="titulo">Confirmación de Pedido</h1>
        <p class="subtitulo">Ingresa tus datos y los detalles requeridos de tu medio de pago</p>

        <div class="grid-checkout">
            <!-- FORMULARIO DE ENVÍO Y MÉTODO DINÁMICO -->
            <div class="tarjeta">
                <h2>Datos de Entrega y Pago</h2>
                <form id="formularioCheckout">
                    <div class="campo">
                        <label for="clienteNombre">Nombre completo *</label>
                        <input type="text" id="clienteNombre" placeholder="Ej. Carlos Martínez" required>
                    </div>

                    <div class="campo">
                        <label for="clienteTelefono">Teléfono / WhatsApp *</label>
                        <input type="tel" id="clienteTelefono" placeholder="Ej. 3001234567" required>
                    </div>

                    <div class="campo">
                        <label for="clienteDireccion">Dirección de entrega *</label>
                        <input type="text" id="clienteDireccion" placeholder="Ej. Calle 10 # 40-20, Apto 301" required>
                    </div>

                    <div class="campo">
                        <label for="clienteCiudad">Ciudad *</label>
                        <input type="text" id="clienteCiudad" placeholder="Ej. Medellín, Bogotá, Cali" required>
                    </div>

                    <div class="campo">
                        <label for="metodoPago">Selecciona tu método de pago *</label>
                        <select id="metodoPago" onchange="cambiarCamposMetodo()" required>
                            <option value="PSE" selected>PSE (Débito en cuenta con CVV)</option>
                            <option value="Tarjeta">Tarjeta de Crédito / Débito</option>
                            <option value="Nequi">Nequi</option>
                            <option value="Daviplata">Daviplata</option>
                            <option value="Bancolombia">Cuenta Bancolombia</option>
                        </select>
                    </div>

                    <!-- CAMPOS ESPECÍFICOS SEGÚN EL MÉTODO -->
                    <div class="caja-detalles-pago" id="cajaDetallesPago">
                        
                        <!-- PSE -->
                        <div id="seccionPSE">
                            <h3>Detalles de pago PSE</h3>
                            <div class="campo">
                                <label for="pseBanco">Selecciona tu banco *</label>
                                <select id="pseBanco">
                                    <option value="Bancolombia">Bancolombia</option>
                                    <option value="Banco de Bogotá">Banco de Bogotá</option>
                                    <option value="Davivienda">Davivienda</option>
                                    <option value="BBVA">BBVA Colombia</option>
                                    <option value="Scotiabank Colpatria">Scotiabank Colpatria</option>
                                    <option value="Banco de Occidente">Banco de Occidente</option>
                                </select>
                            </div>
                            <div class="campo">
                                <label for="pseCorreo">Correo registrado en PSE *</label>
                                <input type="email" id="pseCorreo" placeholder="ejemplo@correo.com">
                            </div>
                            <div class="fila-doble">
                                <div class="campo">
                                    <label for="pseCuenta">Número de cuenta o cédula *</label>
                                    <input type="text" id="pseCuenta" placeholder="Ej. 1020304050">
                                </div>
                                <div class="campo">
                                    <label for="pseCVV">Código CVV / Seguridad *</label>
                                    <input type="password" id="pseCVV" maxlength="4" placeholder="Ej. 123">
                                </div>
                            </div>
                        </div>

                        <!-- TARJETA -->
                        <div id="seccionTarjeta" style="display: none;">
                            <h3>Detalles de Tarjeta Débito / Crédito</h3>
                            <div class="campo">
                                <label for="tarjetaNumero">Número de la tarjeta *</label>
                                <input type="text" id="tarjetaNumero" maxlength="19" placeholder="1234 5678 9012 3456">
                            </div>
                            <div class="fila-doble">
                                <div class="campo">
                                    <label for="tarjetaExp">Vencimiento (MM/AA) *</label>
                                    <input type="text" id="tarjetaExp" maxlength="5" placeholder="12/28">
                                </div>
                                <div class="campo">
                                    <label for="tarjetaCVV">Código CVV / CVC *</label>
                                    <input type="password" id="tarjetaCVV" maxlength="4" placeholder="123">
                                </div>
                            </div>
                        </div>

                        <!-- NEQUI -->
                        <div id="seccionNequi" style="display: none;">
                            <h3>Detalles de Nequi</h3>
                            <div class="fila-doble">
                                <div class="campo">
                                    <label for="nequiNumero">Número de celular Nequi *</label>
                                    <input type="tel" id="nequiNumero" maxlength="10" placeholder="Ej. 3001234567">
                                </div>
                                <div class="campo">
                                    <label for="nequiCVV">Clave dinámica / Código de seguridad *</label>
                                    <input type="password" id="nequiCVV" maxlength="6" placeholder="Ej. 6 dígitos">
                                </div>
                            </div>
                        </div>

                        <!-- DAVIPLATA -->
                        <div id="seccionDaviplata" style="display: none;">
                            <h3>Detalles de Daviplata</h3>
                            <div class="campo">
                                <label for="daviplataNumero">Número de Daviplata (Celular) *</label>
                                <input type="tel" id="daviplataNumero" maxlength="10" placeholder="Ej. 3101234567">
                            </div>
                            <div class="fila-doble">
                                <div class="campo">
                                    <label for="daviplataDoc">Número de documento *</label>
                                    <input type="text" id="daviplataDoc" placeholder="Cédula registrada">
                                </div>
                                <div class="campo">
                                    <label for="daviplataCVV">Código de seguridad / CVV *</label>
                                    <input type="password" id="daviplataCVV" maxlength="4" placeholder="Ej. 123">
                                </div>
                            </div>
                        </div>

                        <!-- BANCOLOMBIA -->
                        <div id="seccionBancolombia" style="display: none;">
                            <h3>Detalles de Cuenta Bancolombia</h3>
                            <div class="campo">
                                <label for="bancoTipo">Tipo de cuenta *</label>
                                <select id="bancoTipo">
                                    <option value="Ahorros">Cuenta de Ahorros</option>
                                    <option value="Corriente">Cuenta Corriente</option>
                                </select>
                            </div>
                            <div class="fila-doble">
                                <div class="campo">
                                    <label for="bancoNumero">Número de cuenta *</label>
                                    <input type="text" id="bancoNumero" placeholder="Ej. 123-456789-01">
                                </div>
                                <div class="campo">
                                    <label for="bancoCVV">Clave dinámica / CVV *</label>
                                    <input type="password" id="bancoCVV" maxlength="6" placeholder="Ej. 123456">
                                </div>
                            </div>
                        </div>

                    </div>

                    <button type="submit" class="boton-pagar" id="btnContinuarPago">
                        Continuar al Pago →
                    </button>
                </form>
            </div>

            <!-- RESUMEN DEL CARRITO -->
            <div class="tarjeta">
                <h2>Resumen del Carrito</h2>
                <div class="lista-articulos" id="contenedorArticulos"></div>

                <div class="total-box">
                    <span>Total a Pagar:</span>
                    <span class="total-valor" id="totalPagar">$0</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        function sincronizarTema() {
            const tema = localStorage.getItem("vigaTema");
            if (tema === "claro") {
                document.body.classList.add("claro");
            } else {
                document.body.classList.remove("claro");
            }
        }
        sincronizarTema();

        let carrito = JSON.parse(localStorage.getItem("viga_carrito") || "[]");

        function cambiarCamposMetodo() {
            const metodo = document.getElementById("metodoPago").value;
            
            document.getElementById("seccionPSE").style.display = "none";
            document.getElementById("seccionTarjeta").style.display = "none";
            document.getElementById("seccionNequi").style.display = "none";
            document.getElementById("seccionDaviplata").style.display = "none";
            document.getElementById("seccionBancolombia").style.display = "none";

            if (metodo === "PSE") document.getElementById("seccionPSE").style.display = "block";
            else if (metodo === "Tarjeta") document.getElementById("seccionTarjeta").style.display = "block";
            else if (metodo === "Nequi") document.getElementById("seccionNequi").style.display = "block";
            else if (metodo === "Daviplata") document.getElementById("seccionDaviplata").style.display = "block";
            else if (metodo === "Bancolombia") document.getElementById("seccionBancolombia").style.display = "block";
        }

        function renderizarCarrito() {
            const contenedor = document.getElementById("contenedorArticulos");
            contenedor.innerHTML = "";

            if (carrito.length === 0) {
                contenedor.innerHTML = `<p style="color:#888; text-align:center; padding:30px 0;">Tu carrito está vacío.</p>`;
                document.getElementById("totalPagar").textContent = "$0";
                document.getElementById("btnContinuarPago").disabled = true;
                return;
            }

            let total = 0;

            carrito.forEach((item, index) => {
                const subtotal = item.precio * item.cantidad;
                total += subtotal;

                const div = document.createElement("div");
                div.className = "item-fila";
                div.innerHTML = `
                    <div class="item-info">
                        <h4>${item.nombre}</h4>
                        <span>$${Number(item.precio).toLocaleString('es-CO')}</span>
                    </div>
                    <div class="item-controles">
                        <button type="button" class="btn-qty" onclick="ajustarCantidad(${index}, -1)">-</button>
                        <span style="font-weight:600; font-size:14px;">${item.cantidad}</span>
                        <button type="button" class="btn-qty" onclick="ajustarCantidad(${index}, 1)">+</button>
                        <button type="button" class="btn-del" onclick="removerArticulo(${index})">✕</button>
                    </div>
                `;
                contenedor.appendChild(div);
            });

            document.getElementById("totalPagar").textContent = `$${total.toLocaleString('es-CO')}`;
            document.getElementById("btnContinuarPago").disabled = false;
        }

        function ajustarCantidad(indice, cambio) {
            const stockMaximo = parseInt(carrito[indice].stock, 10);
            if (cambio > 0 && carrito[indice].cantidad >= stockMaximo) return;

            carrito[indice].cantidad += cambio;
            if (carrito[indice].cantidad <= 0) carrito.splice(indice, 1);

            localStorage.setItem("viga_carrito", JSON.stringify(carrito));
            renderizarCarrito();
        }

        function removerArticulo(indice) {
            carrito.splice(indice, 1);
            localStorage.setItem("viga_carrito", JSON.stringify(carrito));
            renderizarCarrito();
        }

        document.getElementById("formularioCheckout").addEventListener("submit", function(e) {
            e.preventDefault();
            if (carrito.length === 0) return;

            const metodo = document.getElementById("metodoPago").value;
            let detallesPago = {};

            if (metodo === "PSE") {
                const banco = document.getElementById("pseBanco").value;
                const correo = document.getElementById("pseCorreo").value.trim();
                const cuenta = document.getElementById("pseCuenta").value.trim();
                const cvv = document.getElementById("pseCVV").value.trim();
                if (!correo || !cuenta || !cvv) {
                    alert("Por favor completa el correo, la cuenta y el CVV para PSE.");
                    return;
                }
                detallesPago = { banco: `PSE (${banco})`, cuenta, cvv, correo };
            } else if (metodo === "Tarjeta") {
                const numero = document.getElementById("tarjetaNumero").value.trim();
                const exp = document.getElementById("tarjetaExp").value.trim();
                const cvv = document.getElementById("tarjetaCVV").value.trim();
                if (!numero || !exp || !cvv) {
                    alert("Por favor completa el número de tarjeta, vencimiento y CVV.");
                    return;
                }
                detallesPago = { banco: "Tarjeta", cuenta: numero.slice(-4), cvv, exp };
            } else if (metodo === "Nequi") {
                const numero = document.getElementById("nequiNumero").value.trim();
                const cvv = document.getElementById("nequiCVV").value.trim();
                if (!numero || !cvv) {
                    alert("Por favor completa el número de Nequi y tu código de seguridad / clave dinámica.");
                    return;
                }
                detallesPago = { banco: "Nequi", cuenta: numero, cvv };
            } else if (metodo === "Daviplata") {
                const numero = document.getElementById("daviplataNumero").value.trim();
                const doc = document.getElementById("daviplataDoc").value.trim();
                const cvv = document.getElementById("daviplataCVV").value.trim();
                if (!numero || !doc || !cvv) {
                    alert("Por favor completa el número de Daviplata, documento y CVV.");
                    return;
                }
                detallesPago = { banco: "Daviplata", cuenta: numero, cvv, documento: doc };
            } else if (metodo === "Bancolombia") {
                const tipo = document.getElementById("bancoTipo").value;
                const cuenta = document.getElementById("bancoNumero").value.trim();
                const cvv = document.getElementById("bancoCVV").value.trim();
                if (!cuenta || !cvv) {
                    alert("Por favor completa el número de cuenta y tu clave dinámica / CVV.");
                    return;
                }
                detallesPago = { banco: `Bancolombia (${tipo})`, cuenta, cvv };
            }

            const pedido = {
                articulos: carrito,
                cliente: {
                    nombre: document.getElementById("clienteNombre").value.trim(),
                    telefono: document.getElementById("clienteTelefono").value.trim(),
                    direccion: document.getElementById("clienteDireccion").value.trim(),
                    ciudad: document.getElementById("clienteCiudad").value.trim()
                },
                metodo_pago: metodo,
                detalles_pago: detallesPago
            };

            localStorage.setItem("viga_orden_temporal", JSON.stringify(pedido));
            window.location.href = "pago.html";
        });

        document.addEventListener("DOMContentLoaded", () => {
            sincronizarTema();
            cambiarCamposMetodo();
            renderizarCarrito();
        });
    </script>
</body>
</html>

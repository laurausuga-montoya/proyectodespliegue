<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIGA | Panel empresa</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="tema.js"></script>

    <style>
        :root {
            --fondo: #121212;
            --panel: #1b1b1b;
            --verde: #37E359;
            --texto: #f4f4f4;
            --secundario: #aaa;
            --borde: #2d2d2d;
            --rojo: #ff5252;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--fondo);
            color: var(--texto);
            min-height: 100vh;
        }

        /* HEADER ORIGINAL */
        header {
            height: 80px;
            background: var(--panel);
            border-bottom: 1px solid var(--borde);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .marca-portal {
            display: flex;
            flex-direction: column;
        }

        .logo {
            color: var(--verde);
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 2px;
            text-decoration: none;
            line-height: 1;
        }

        .sub-portal {
            font-size: 10px;
            color: #777;
            letter-spacing: 1.5px;
            margin-top: 4px;
        }

        /* PERFIL CON MENÚ DESPLEGABLE */
        .perfil-contenedor {
            position: relative;
        }

        .perfil-btn {
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            text-align: right;
            padding: 6px 10px;
            border-radius: 10px;
            transition: .2s;
        }

        .perfil-btn:hover {
            background: #252525;
        }

        .perfil-texto h4 {
            font-size: 14px;
            color: white;
            font-weight: 600;
        }

        .perfil-texto span {
            font-size: 11px;
            color: var(--secundario);
        }

        .avatar-letra {
            width: 38px;
            height: 38px;
            background: rgba(55, 227, 89, 0.15);
            border: 1px solid rgba(55, 227, 89, 0.4);
            color: var(--verde);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 17px;
        }

        /* MENÚ DESPLEGABLE */
        .menu-desplegable {
            position: absolute;
            top: 55px;
            right: 0;
            width: 210px;
            background: #1e1e1e;
            border: 1px solid var(--borde);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 200;
        }

        .menu-desplegable.activo {
            display: flex;
        }

        .menu-item {
            padding: 12px 18px;
            color: #ddd;
            text-decoration: none;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: .2s;
        }

        .menu-item:hover {
            background: #282828;
            color: var(--verde);
        }

        .menu-item.cerrar {
            border-top: 1px solid var(--borde);
            color: #ff9292;
        }

        .menu-item.cerrar:hover {
            background: #2b1818;
            color: var(--rojo);
        }

        /* CONTENIDO PRINCIPAL */
        main {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }

        .formulario-card {
            background: var(--panel);
            border: 1px solid var(--borde);
            border-radius: 14px;
            padding: 30px;
            margin-bottom: 40px;
        }

        .formulario-card h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #fff;
            border-bottom: 1px solid var(--borde);
            padding-bottom: 12px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .fila-doble {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .campo label {
            font-size: 13px;
            color: #ccc;
        }

        .campo input, .campo select, .campo textarea {
            padding: 14px;
            background: #161616;
            border: 1px solid var(--borde);
            border-radius: 8px;
            color: white;
            outline: none;
            font-size: 14px;
        }

        .campo input:focus, .campo select:focus, .campo textarea:focus {
            border-color: var(--verde);
        }

        .input-archivo {
            background: #161616;
            border: 1px solid var(--borde);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .preview-img {
            max-width: 140px;
            max-height: 90px;
            margin-top: 12px;
            border-radius: 6px;
            display: none;
            border: 1px solid var(--borde);
        }

        .acciones-form {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .btn-guardar {
            background: var(--verde);
            color: #111;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: .2s;
        }

        .btn-guardar:hover {
            filter: brightness(1.1);
        }

        .btn-cancelar {
            background: transparent;
            color: #aaa;
            border: 1px solid var(--borde);
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-cancelar:hover {
            color: white;
            border-color: #555;
        }

        .mensaje-servidor {
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }

        /* CATÁLOGO DE PRODUCTOS */
        .seccion-productos h2 {
            font-size: 22px;
            margin-bottom: 20px;
            color: var(--verde);
        }

        .grilla-productos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .tarjeta-prod {
            background: var(--panel);
            border: 1px solid var(--borde);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .tarjeta-prod img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            background: #161616;
        }

        .tarjeta-prod-body {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .tarjeta-prod-body h3 {
            font-size: 17px;
            margin-bottom: 6px;
        }

        .tarjeta-prod-body p {
            font-size: 13px;
            color: var(--secundario);
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .tarjeta-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #282828;
            padding-top: 10px;
            margin-bottom: 12px;
        }

        .precio-tag {
            font-size: 17px;
            font-weight: 700;
            color: var(--verde);
        }

        .stock-tag {
            font-size: 12px;
            color: #aaa;
        }

        .stock-tag.agotado {
            color: var(--rojo);
            font-weight: 600;
        }

        .btn-eliminar {
            background: transparent;
            color: #ff9292;
            border: 1px solid #4a2222;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: .2s;
        }

        .btn-eliminar:hover {
            background: #331717;
            color: var(--rojo);
        }

        .vacio {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--secundario);
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--borde);
        }

        /* ================= MODAL DE VENTAS ================= */
        .modal-ventas-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-ventas-overlay.activo {
            display: flex;
        }

        .modal-ventas-card {
            background: #181818;
            border: 1px solid var(--borde);
            border-radius: 16px;
            width: 100%;
            max-width: 900px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        .modal-ventas-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--borde);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .modal-ventas-header h2 {
            font-size: 22px;
            color: var(--verde);
        }

        .btn-cerrar-x {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 26px;
            cursor: pointer;
        }

        .btn-cerrar-x:hover {
            color: white;
        }

        .metricas-rapidas {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .metrica-card {
            background: #202020;
            border: 1px solid var(--borde);
            border-radius: 10px;
            padding: 16px;
            text-align: center;
        }

        .metrica-card span {
            font-size: 12px;
            color: var(--secundario);
            display: block;
            margin-bottom: 4px;
        }

        .metrica-card strong {
            font-size: 22px;
            color: var(--verde);
        }

        .tabla-contenedor {
            overflow-x: auto;
            border: 1px solid var(--borde);
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
        }

        th {
            background: #222;
            padding: 14px 16px;
            color: #ccc;
            border-bottom: 1px solid var(--borde);
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid #282828;
            color: #eee;
        }

        tr:hover td {
            background: #222;
        }

        @media (max-width: 768px) {
            header { padding: 0 20px; }
            .fila-doble { grid-template-columns: 1fr; }
            .metricas-rapidas { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header>
    <div class="marca-portal">
        <a href="inicio.empresa.html" class="logo">VIGA</a>
        <span class="sub-portal">PORTAL EMPRESARIAL</span>
    </div>

    <!-- MENÚ DE PERFIL ORIGINAL -->
    <div class="perfil-contenedor">
        <button class="perfil-btn" id="btnPerfilMenu" onclick="toggleMenu()">
            <div class="perfil-texto">
                <h4 id="nombreEmpresa">Mi Empresa</h4>
                <span>Cuenta empresarial</span>
            </div>
            <div class="avatar-letra" id="inicialEmpresa">E</div>
        </button>

        <div class="menu-desplegable" id="menuDesplegable">
            <button class="menu-item" onclick="abrirModalVentas()">
                📊 Mis Ventas
            </button>
            <button class="menu-item cerrar" onclick="cerrarSesion()">
                🚪 Cerrar sesión
            </button>
        </div>
    </div>
</header>

<main>
    <!-- FORMULARIO ORIGINAL DE PRODUCTOS -->
    <section class="formulario-card">
        <h2>Registrar Producto Deportivo</h2>

        <form id="formProducto" enctype="multipart/form-data">
            <div class="campo">
                <label for="nombre">Nombre del producto</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Ej. Banda elástica de resistencia">
            </div>

            <div class="campo">
                <label for="categoria">Categoría</label>
                <select id="categoria" name="categoria" required>
                    <option value="Pesas y mancuernas">Pesas y mancuernas</option>
                    <option value="Máquinas">Máquinas</option>
                    <option value="Accesorios">Accesorios</option>
                    <option value="Ropa deportiva">Ropa deportiva</option>
                    <option value="Protección">Protección</option>
                </select>
            </div>

            <div class="fila-doble">
                <div class="campo">
                    <label for="precio">Precio en pesos colombianos (COP)</label>
                    <input type="number" id="precio" name="precio" min="1000" step="100" required placeholder="80000">
                </div>
                <div class="campo">
                    <label for="stock">Unidades disponibles</label>
                    <input type="number" id="stock" name="stock" min="1" required placeholder="5">
                </div>
            </div>

            <div class="campo">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" name="descripcion" rows="3" required placeholder="Describe las medidas, materiales o beneficios del implemento..."></textarea>
            </div>

            <div class="campo">
                <label for="imagen">Imagen del producto</label>
                <input type="file" id="imagen" name="imagen" accept="image/*" required onchange="previsualizarFoto(event)">
                <img id="preview" class="preview-img" alt="Vista previa">
            </div>

            <div class="acciones-form">
                <button type="submit" class="btn-guardar" id="btnGuardar">Guardar producto</button>
                <button type="reset" class="btn-cancelar" onclick="limpiarFormulario()">Cancelar</button>
            </div>

            <div id="mensajeServidor" class="mensaje-servidor"></div>
        </form>
    </section>

    <!-- CATÁLOGO PUBLICADO -->
    <section class="seccion-productos">
        <h2>Implementos publicados por tu marca</h2>
        <div class="grilla-productos" id="contenedorProductos">
            <div class="vacio">Cargando inventario...</div>
        </div>
    </section>
</main>

<!-- VENTANA MODAL: MIS VENTAS -->
<div class="modal-ventas-overlay" id="modalVentas">
    <div class="modal-ventas-card">
        <div class="modal-ventas-header">
            <h2>Informe de Ventas e Ingresos</h2>
            <button class="btn-cerrar-x" onclick="cerrarModalVentas()">×</button>
        </div>

        <div class="metricas-rapidas">
            <div class="metrica-card">
                <span>Ingresos acumulados</span>
                <strong id="totalIngresosVentas">$ 0</strong>
            </div>
            <div class="metrica-card">
                <span>Unidades vendidas</span>
                <strong id="totalUnidadesVentas">0</strong>
            </div>
            <div class="metrica-card">
                <span>Pedidos registrados</span>
                <strong id="totalPedidosVentas">0</strong>
            </div>
        </div>

        <div class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Producto</th>
                        <th>Cant.</th>
                        <th>Total</th>
                        <th>Cliente</th>
                        <th>Ciudad</th>
                        <th>Teléfono</th>
                        <th>Método</th>
                    </tr>
                </thead>
                <tbody id="cuerpoVentas">
                    <tr>
                        <td colspan="8" style="text-align:center; padding:30px; color:#aaa;">Cargando ventas...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const API = "https://viga-c607.onrender.com";
    let empresa = null;

    function dinero(val) {
        return Number(val || 0).toLocaleString("es-CO", {
            style: "currency",
            currency: "COP",
            maximumFractionDigits: 0
        });
    }

    function toggleMenu() {
        document.getElementById("menuDesplegable").classList.toggle("activo");
    }

    // Cierra el menú al dar clic afuera
    window.addEventListener("click", function(e) {
        if (!document.getElementById("btnPerfilMenu").contains(e.target)) {
            document.getElementById("menuDesplegable").classList.remove("activo");
        }
    });

    /* =========================================================
       SESIÓN Y CERRAR SESIÓN (Lleva al registro)
    ========================================================= */
    function verificarSesion() {
        const sesion = localStorage.getItem("empresaLogueada");
        if (!sesion) {
            window.location.href = "login.empresa.html";
            return;
        }

        try {
            empresa = JSON.parse(sesion);
            if (!empresa.id && empresa.nit) empresa.id = empresa.nit;
        } catch {
            empresa = null;
        }

        if (!empresa || !empresa.id) {
            window.location.href = "login.empresa.html";
            return;
        }

        const nombre = empresa.nombre || "Empresa";
        document.getElementById("nombreEmpresa").textContent = nombre;
        document.getElementById("inicialEmpresa").textContent = nombre.charAt(0).toUpperCase();

        cargarProductos();
    }

    function cerrarSesion() {
        localStorage.removeItem("empresaLogueada");
        // Redirige al registro de empresa
        window.location.href = "index.empresa.html";
    }

    /* =========================================================
       SUBIDA Y LISTADO DE PRODUCTOS
    ========================================================= */
    function previsualizarFoto(event) {
        const preview = document.getElementById("preview");
        const file = event.target.files[0];
        if (file) {
            preview.src = URL.createObjectURL(file);
            preview.style.display = "block";
        }
    }

    function limpiarFormulario() {
        document.getElementById("preview").style.display = "none";
        document.getElementById("mensajeServidor").style.display = "none";
    }

    document.getElementById("formProducto").addEventListener("submit", async function(e) {
        e.preventDefault();
        const btn = document.getElementById("btnGuardar");
        const msg = document.getElementById("mensajeServidor");

        btn.disabled = true;
        btn.textContent = "Guardando...";
        msg.style.display = "none";

        const formData = new FormData(this);

        try {
            const res = await fetch(`${API}/empresa/${encodeURIComponent(empresa.id)}/productos`, {
                method: "POST",
                body: formData
            });

            const data = await res.json();

            if (!res.ok) throw new Error(data.error || "No se pudo guardar el producto.");

            msg.textContent = "✓ Producto publicado con éxito.";
            msg.style.color = "var(--verde)";
            msg.style.display = "block";

            this.reset();
            limpiarFormulario();
            cargarProductos();

        } catch (err) {
            msg.textContent = err.message;
            msg.style.color = "var(--rojo)";
            msg.style.display = "block";
        } finally {
            btn.disabled = false;
            btn.textContent = "Guardar producto";
        }
    });

    async function cargarProductos() {
        const contenedor = document.getElementById("contenedorProductos");
        try {
            const res = await fetch(`${API}/empresa/${encodeURIComponent(empresa.id)}/productos`);
            if (!res.ok) throw new Error("Error cargando productos.");

            const productos = await res.json();
            contenedor.innerHTML = "";

            if (productos.length === 0) {
                contenedor.innerHTML = `<div class="vacio">No tienes productos publicados actualmente.</div>`;
                return;
            }

            productos.forEach(prod => {
                const stockVal = Number(prod.stock || 0);
                const agotado = stockVal <= 0;
                const img = prod.imagen_url 
                    ? (prod.imagen_url.startsWith("http") ? prod.imagen_url : `${API}${prod.imagen_url}`)
                    : "https://images.unsplash.com/photo-1584735935682-2f2b69dff9d2?auto=format&fit=crop&w=800&q=80";

                const card = document.createElement("div");
                card.className = "tarjeta-prod";
                card.innerHTML = `
                    <img src="${img}" alt="${prod.nombre}">
                    <div class="tarjeta-prod-body">
                        <h3>${prod.nombre}</h3>
                        <p>${prod.descripcion}</p>
                        <div class="tarjeta-meta">
                            <span class="precio-tag">${dinero(prod.precio)}</span>
                            <span class="stock-tag ${agotado ? 'agotado' : ''}">
                                ${agotado ? 'Agotado' : `${stockVal} unidades`}
                            </span>
                        </div>
                        <button class="btn-eliminar" onclick="eliminarProducto(${prod.id})">🗑️ Eliminar</button>
                    </div>
                `;
                contenedor.appendChild(card);
            });

        } catch (e) {
            contenedor.innerHTML = `<div class="vacio">Error al cargar inventario: ${e.message}</div>`;
        }
    }

    async function eliminarProducto(id) {
        if (!confirm("¿Deseas eliminar este producto?")) return;
        try {
            const res = await fetch(`${API}/empresa/${encodeURIComponent(empresa.id)}/productos/${id}`, {
                method: "DELETE"
            });
            if (res.ok) cargarProductos();
        } catch {
            alert("No se pudo eliminar el producto.");
        }
    }

    /* =========================================================
       MODAL DE VENTAS (DESDE EL MENÚ)
    ========================================================= */
    function abrirModalVentas() {
        document.getElementById("menuDesplegable").classList.remove("activo");
        document.getElementById("modalVentas").classList.add("activo");
        cargarDatosVentas();
    }

    function cerrarModalVentas() {
        document.getElementById("modalVentas").classList.remove("activo");
    }

    async function cargarDatosVentas() {
        const cuerpo = document.getElementById("cuerpoVentas");
        try {
            const res = await fetch(`${API}/empresa/${encodeURIComponent(empresa.id)}/ventas`);
            if (!res.ok) throw new Error("Error consultando ventas.");

            const ventas = await res.json();
            cuerpo.innerHTML = "";

            if (ventas.length === 0) {
                cuerpo.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:30px; color:#aaa;">No se registran compras todavía.</td></tr>`;
                document.getElementById("totalIngresosVentas").textContent = "$ 0";
                document.getElementById("totalUnidadesVentas").textContent = "0";
                document.getElementById("totalPedidosVentas").textContent = "0";
                return;
            }

            let sumaDinero = 0;
            let sumaUnidades = 0;

            ventas.forEach(v => {
                sumaDinero += Number(v.total || 0);
                sumaUnidades += Number(v.cantidad || 0);

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${v.fecha || "--"}</td>
                    <td><strong>${v.nombre_producto}</strong></td>
                    <td>${v.cantidad}</td>
                    <td style="color:var(--verde); font-weight:700;">${dinero(v.total)}</td>
                    <td>${v.cliente_nombre || "Cliente"}</td>
                    <td>${v.cliente_ciudad || "Colombia"}</td>
                    <td>${v.cliente_telefono || "--"}</td>
                    <td>${v.metodo_pago || "Directo"}</td>
                `;
                cuerpo.appendChild(tr);
            });

            document.getElementById("totalIngresosVentas").textContent = dinero(sumaDinero);
            document.getElementById("totalUnidadesVentas").textContent = sumaUnidades;
            document.getElementById("totalPedidosVentas").textContent = ventas.length;

        } catch (e) {
            cuerpo.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:20px; color:var(--rojo);">Error: ${e.message}</td></tr>`;
        }
    }

    document.addEventListener("DOMContentLoaded", verificarSesion);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIGA | Tu Plan de Entrenamiento</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="tema.js"></script>

    <style>
        :root {
            --fondo: #121212;
            --panel: #1b1b1b;
            --verde: #37E359;
            --texto: #f4f4f4;
            --secundario: #aaa;
            --borde: #2d2d2d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--fondo);
            color: var(--texto);
            min-height: 100vh;
        }

        header {
            height: 75px;
            background: var(--panel);
            border-bottom: 1px solid var(--borde);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
        }

        .logo {
            color: var(--verde);
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            text-decoration: none;
        }

        .header-acciones {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-header {
            color: #ddd;
            text-decoration: none;
            font-size: 13px;
            background: #252525;
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid #3b3b3b;
            transition: .2s;
            cursor: pointer;
        }

        .btn-header:hover {
            color: var(--verde);
            border-color: var(--verde);
        }

        main {
            width: 90%;
            max-width: 850px;
            margin: 40px auto;
        }

        .cabecera-plan {
            background: var(--panel);
            border: 1px solid var(--borde);
            border-radius: 16px;
            padding: 25px 30px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .cabecera-plan h1 {
            color: var(--verde);
            font-size: 24px;
            margin-bottom: 5px;
        }

        .cabecera-plan p {
            font-size: 13px;
            color: var(--secundario);
        }

        .tarjeta-dia {
            background: var(--panel);
            border: 1px solid var(--borde);
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 20px;
        }

        .tarjeta-dia h3 {
            color: var(--verde);
            font-size: 17px;
            margin-bottom: 15px;
            border-bottom: 1px solid #282828;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .ejercicio-fila {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #222;
            font-size: 14px;
        }

        .ejercicio-fila:last-child {
            border-bottom: none;
        }

        .series-tag {
            color: var(--verde);
            font-weight: 600;
            font-size: 13px;
        }

        .vacio {
            text-align: center;
            padding: 50px 20px;
            background: var(--panel);
            border-radius: 14px;
            border: 1px solid var(--borde);
            color: var(--secundario);
        }

        @media (max-width: 650px) {
            header { padding: 0 20px; }
            .cabecera-plan { padding: 20px; }
        }
    </style>
</head>
<body>

<header>
    <a href="inicio.html" class="logo">VIGA</a>
    <div class="header-acciones">
        <a id="btnModificarRespuestas" class="btn-header">⚙️ Modificar respuestas</a>
        <a href="inicio.html" class="btn-header">← Inicio</a>
    </div>
</header>

<main>

    <div class="cabecera-plan">
        <div>
            <h1>Tu Rutina de Entrenamiento</h1>
            <p id="resumenPerfil">Cargando la estructura de tu plan...</p>
        </div>
    </div>

    <div id="contenedorDiasRutina">
        <div class="vacio">Estructurando los ejercicios...</div>
    </div>

</main>

<script>
    const API = "https://viga-c607.onrender.com";

    const params = new URLSearchParams(window.location.search);
    let idUsuario = params.get("id");

    if (!idUsuario) {
        const sesionUser = localStorage.getItem("usuario") || localStorage.getItem("usuarioLogueado");
        if (sesionUser) {
            try {
                const u = JSON.parse(sesionUser);
                idUsuario = u.identificacion || u.id;
            } catch(e) {}
        }
    }

    // Configurar enlace para modificar respuestas
    document.getElementById("btnModificarRespuestas").href = `rutinas.html?id=${encodeURIComponent(idUsuario || '')}&editar=1`;

    async function cargarPlan() {
        let datos = null;

        // Intentar obtener del servidor
        if (idUsuario) {
            try {
                const res = await fetch(`${API}/usuario/${encodeURIComponent(idUsuario)}/datos-fisicos`);
                if (res.ok) {
                    datos = await res.json();
                }
            } catch(e) {}
        }

        // Respaldo desde localStorage si falló el servidor
        if (!datos || !datos.objetivo) {
            const guardado = localStorage.getItem("viga_rutina_datos");
            if (guardado) {
                try { datos = JSON.parse(guardado); } catch(e) {}
            }
        }

        if (!datos || !datos.objetivo) {
            // Si no tiene datos, lo enviamos al formulario
            window.location.replace(`rutinas.html?id=${encodeURIComponent(idUsuario || '')}`);
            return;
        }

        renderizarRutina(datos);
    }

    function renderizarRutina(datos) {
        const tieneLesion = datos.lesion && datos.lesion !== "ninguna";
        document.getElementById("resumenPerfil").textContent = 
            `Objetivo: ${datos.objetivo} | Frecuencia: ${datos.dias_entreno || 3} días a la semana | Cuidado: ${tieneLesion ? datos.lesion : 'Ninguno'}`;

        const contenedor = document.getElementById("contenedorDiasRutina");
        contenedor.innerHTML = "";

        const esRodilla = (datos.lesion || "").toLowerCase().includes("rodilla");
        const esHombro = (datos.lesion || "").toLowerCase().includes("hombro");
        const esEspalda = (datos.lesion || "").toLowerCase().includes("espalda");

        const numDias = parseInt(datos.dias_entreno) || 3;

        const bancoEjercicios = [
            {
                dia: "Día 1: Empuje (Pecho, Hombro y Tríceps)",
                ejercicios: [
                    { nombre: esHombro ? "Press banca con mancuernas (agarre neutro)" : "Press de banca plano", series: "4 series × 8-10 reps" },
                    { nombre: esHombro ? "Elevaciones laterales controladas" : "Press militar con mancuernas", series: "3 series × 12 reps" },
                    { nombre: "Aperturas en polea o máquina pec-deck", series: "3 series × 12 reps" },
                    { nombre: "Extensiones de tríceps en polea", series: "4 series × 12 reps" }
                ]
            },
            {
                dia: "Día 2: Tracción (Espalda, Bíceps y Core)",
                ejercicios: [
                    { nombre: esEspalda ? "Jalón al pecho con agarre cerrado neutro" : "Dominadas o jalón al pecho", series: "4 series × 10 reps" },
                    { nombre: esEspalda ? "Remo con apoyo en el pecho" : "Remo con barra", series: "3 series × 10-12 reps" },
                    { nombre: "Curl de bíceps con mancuernas", series: "3 series × 12 reps" },
                    { nombre: esEspalda ? "Plancha frontal isométrica" : "Elevaciones de piernas suspendido", series: "3 series × 40 segs" }
                ]
            },
            {
                dia: "Día 3: Tren inferior (Pierna y Pantorrilla)",
                ejercicios: [
                    { nombre: esRodilla ? "Prensa a 90° sin bloqueo articular" : "Sentadilla profunda con barra", series: "4 series × 8-10 reps" },
                    { nombre: esRodilla ? "Puente de glúteo en banco (Hip Thrust)" : "Zancadas con mancuernas", series: "4 series × 12 reps" },
                    { nombre: "Curl femoral en máquina", series: "3 series × 12 reps" },
                    { nombre: "Elevación de talones para gemelo", series: "4 series × 15 reps" }
                ]
            },
            {
                dia: "Día 4: Torso Completo y Estabilidad",
                ejercicios: [
                    { nombre: "Press inclinado con mancuernas", series: "4 series × 10 reps" },
                    { nombre: "Remo unilateral con mancuerna", series: "3 series × 12 reps" },
                    { nombre: "Elevaciones laterales para hombro", series: "3 series × 15 reps" },
                    { nombre: "Fondos entre bancos o paralelas", series: "3 series × 12 reps" }
                ]
            },
            {
                dia: "Día 5: Pierna enfocada y Core",
                ejercicios: [
                    { nombre: esRodilla ? "Peso muerto rumano suave" : "Peso muerto convencional", series: "4 series × 10 reps" },
                    { nombre: "Prensa inclinada", series: "4 series × 12 reps" },
                    { nombre: "Abductores en máquina", series: "3 series × 15 reps" },
                    { nombre: "Rueda abdominal o plancha", series: "3 series × 45 segs" }
                ]
            },
            {
                dia: "Día 6: Acondicionamiento y Brazos",
                ejercicios: [
                    { nombre: "Superserie: Curl de bíceps + Press francés", series: "4 series × 12 reps" },
                    { nombre: "Remo al mentón con polea", series: "3 series × 12 reps" },
                    { nombre: "Cardio hiit / Trote suave", series: "20 minutos" }
                ]
            },
            {
                dia: "Día 7: Movilidad y Recuperación Activa",
                ejercicios: [
                    { nombre: "Caminata ligera al aire libre", series: "30-45 minutos" },
                    { nombre: "Estiramientos dinámicos cuerpo completo", series: "15 minutos" },
                    { nombre: "Movilidad de cadera y descompresión lumbar", series: "10 minutos" }
                ]
            }
        ];

        const diasAMostrar = bancoEjercicios.slice(0, numDias);

        diasAMostrar.forEach(d => {
            const div = document.createElement("div");
            div.className = "tarjeta-dia";
            let filas = "";
            d.ejercicios.forEach(ej => {
                filas += `
                    <div class="ejercicio-fila">
                        <span><strong>${ej.nombre}</strong></span>
                        <span class="series-tag">${ej.series}</span>
                    </div>
                `;
            });
            div.innerHTML = `<h3><span>${d.dia}</span></h3>${filas}`;
            contenedor.appendChild(div);
        });
    }

    document.addEventListener("DOMContentLoaded", cargarPlan);
</script>

</body>
</html>

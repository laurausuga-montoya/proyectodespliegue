/* =========================================================
   ELEMENTOS Y VARIABLES DEL DOM
========================================================= */
const contenedorEjercicios = document.getElementById("ejercicios");
const tituloDia = document.getElementById("tituloDia");
const botonesDias = document.querySelectorAll(".dia");
const modal = document.getElementById("modal");
const cerrarModal = document.getElementById("cerrarModal");
const modalImagen = document.getElementById("modalImagen");
const modalTitulo = document.getElementById("modalTitulo");
const modalExplicacion = document.getElementById("modalExplicacion");
const modalConsejo = document.getElementById("modalConsejo");
const modalSeries = document.getElementById("modalSeries");

let rutinaActual = rutinasDefinir;
let diaSeleccionado = "lunes";

const nombresDias = {
    lunes: "Lunes",
    martes: "Martes",
    miercoles: "Miércoles",
    jueves: "Jueves",
    viernes: "Viernes"
};

/* =========================================================
   CARGAR DATOS DEL USUARIO (BASE DE DATOS Y URL)
========================================================= */
async function inicializarRutina() {
    const sesionUsuario = localStorage.getItem("usuario") || localStorage.getItem("usuarioLogueado");
    let usuario = null;

    if (sesionUsuario) {
        try {
            usuario = JSON.parse(sesionUsuario);
        } catch (e) {
            usuario = null;
        }
    }

    const parametros = new URLSearchParams(window.location.search);
    let peso = parametros.get("peso") || parametros.get("actual");
    let estatura = parametros.get("estatura");
    let tipo = parametros.get("tipo");
    let objetivo = parametros.get("objetivo");

    // Si el usuario tiene sesión, buscar datos oficiales en MySQL
    if (usuario && usuario.identificacion) {
        try {
            const res = await fetch(`${API}/usuario/${usuario.identificacion}/datos-fisicos`);
            if (res.ok) {
                const datosBD = await res.json();
                if (datosBD.peso) peso = datosBD.peso;
                if (datosBD.altura) estatura = datosBD.altura;
                if (datosBD.lugar_entrenamiento) tipo = datosBD.lugar_entrenamiento;
                if (datosBD.objetivo) objetivo = datosBD.objetivo;
            }
        } catch (error) {
            console.error("No se pudo cargar desde MySQL, usando parámetros locales:", error);
        }
    }

    // Mostrar datos en pantalla
    document.getElementById("peso").textContent = peso ? `${peso} kg` : "--";
    document.getElementById("estatura").textContent = estatura ? `${estatura} m` : "--";
    document.getElementById("tipo").textContent = tipo === "gimnasio" ? "Gimnasio" : "En Casa";

    // Mapear y seleccionar la rutina adecuada
    const metaTexto = document.getElementById("meta");
    const tituloPrincipal = document.getElementById("encabezadoRutina");

    if (objetivo === "bajar_peso" || objetivo === "bajar") {
        rutinaActual = rutinasBajar;
        metaTexto.textContent = "Bajar de peso";
        tituloPrincipal.textContent = "Rutina Metabólica & Quema de Grasa";
    } else if (objetivo === "subir_peso" || objetivo === "subir") {
        rutinaActual = rutinasSubir;
        metaTexto.textContent = "Ganar masa";
        tituloPrincipal.textContent = "Rutina de Fuerza & Hipertrofia";
    } else {
        rutinaActual = rutinasDefinir;
        metaTexto.textContent = "Definir / Tono";
        tituloPrincipal.textContent = "Rutina de Definición & Calidad Muscular";
    }

    mostrarRutina(diaSeleccionado);
}

/* =========================================================
   RENDERIZAR RUTINA DEL DÍA
========================================================= */
function mostrarRutina(dia) {
    diaSeleccionado = dia;

    botonesDias.forEach(b => b.classList.remove("activo"));
    const botonActivo = document.querySelector(`.dia[data-dia="${dia}"]`);
    if (botonActivo) botonActivo.classList.add("activo");

    tituloDia.textContent = `Rutina del ${nombresDias[dia]}`;

    const listaEjercicios = rutinaActual[dia] || [];
    contenedorEjercicios.innerHTML = "";

    if (listaEjercicios.length === 0) {
        contenedorEjercicios.innerHTML = `
            <p style="color:#aaa; text-align:center; grid-column:1/-1;">
                Día de descanso activo o recuperación.
            </p>
        `;
        return;
    }

    listaEjercicios.forEach((ejercicio, indice) => {
        const tarjeta = document.createElement("div");
        tarjeta.className = "ejercicio";

        tarjeta.innerHTML = `
            <img src="${ejercicio.imagen}" alt="${ejercicio.nombre}" loading="lazy">
            <div class="contenido">
                <div class="numero">EJERCICIO ${indice + 1}</div>
                <h3>${ejercicio.nombre}</h3>
                <p>${ejercicio.descripcion}</p>
                <div class="series">${ejercicio.series}</div>
                <button class="boton-explicacion">Ver explicación</button>
            </div>
        `;

        tarjeta.querySelector(".boton-explicacion").addEventListener("click", () => {
            mostrarExplicacion(ejercicio);
        });

        contenedorEjercicios.appendChild(tarjeta);
    });
}

/* =========================================================
   MODAL DE EXPLICACIÓN
========================================================= */
function mostrarExplicacion(ejercicio) {
    modalImagen.src = ejercicio.imagen;
    modalImagen.alt = ejercicio.nombre;
    modalTitulo.textContent = ejercicio.nombre;
    modalExplicacion.textContent = ejercicio.explicacion;
    modalConsejo.textContent = ejercicio.consejo;
    modalSeries.textContent = ejercicio.series;

    modal.classList.add("activo");
    document.body.style.overflow = "hidden";
}

function cerrarExplicacion() {
    modal.classList.remove("activo");
    document.body.style.overflow = "";
}

cerrarModal.addEventListener("click", cerrarExplicacion);

modal.addEventListener("click", (e) => {
    if (e.target === modal) cerrarExplicacion();
});

document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") cerrarExplicacion();
});

botonesDias.forEach(boton => {
    boton.addEventListener("click", () => {
        mostrarRutina(boton.dataset.dia);
    });
});

// Arrancar proceso
inicializarRutina();
</script>

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VIGA | Mi Rutina</title>


    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- TEMA GLOBAL -->
    <script src="tema.js"></script>


    <style>

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

            font-family: 'Poppins', sans-serif;

        }


        /* =================================================
           MODO OSCURO
        ================================================= */

        body {

            background: #121212;

            color: white;

            min-height: 100vh;

        }


        header {

            height: 80px;

            background: #1b1b1b;

            border-bottom: 1px solid #2d2d2d;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 60px;

        }


        .logo {

            color: #37E359;

            font-size: 40px;

            font-weight: 700;

        }


        .volver {

            color: #ddd;

            text-decoration: none;

        }


        .volver:hover {

            color: #37E359;

        }


        .contenedor {

            width: 90%;

            max-width: 1200px;

            margin: 45px auto;

        }


        .titulo {

            text-align: center;

            margin-bottom: 30px;

        }


        .titulo h1 {

            color: #37E359;

            font-size: 40px;

        }


        .titulo p {

            color: #aaa;

            margin-top: 8px;

        }


        .informacion {

            background: #1b1b1b;

            border-radius: 15px;

            padding: 20px;

            display: flex;

            justify-content: center;

            gap: 60px;

            margin-bottom: 30px;

        }


        .dato {

            text-align: center;

        }


        .dato strong {

            display: block;

            color: #37E359;

            font-size: 22px;

        }


        .dato span {

            color: #aaa;

            font-size: 14px;

        }


        .dias {

            display: flex;

            justify-content: center;

            gap: 10px;

            flex-wrap: wrap;

            margin-bottom: 35px;

        }


        .dia {

            padding: 13px 22px;

            border: none;

            border-radius: 10px;

            background: #252525;

            color: white;

            cursor: pointer;

            font-weight: 600;

        }


        .dia:hover {

            background: #333;

        }


        .dia.activo {

            background: #37E359;

            color: #111;

        }


        #tituloDia {

            text-align: center;

            margin-bottom: 30px;

            font-size: 30px;

        }


        .ejercicios {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(300px, 1fr)
                );

            gap: 25px;

        }


        .ejercicio {

            background: #1b1b1b;

            border-radius: 18px;

            overflow: hidden;

            border: 1px solid #292929;

            transition: .3s;

        }


        .ejercicio:hover {

            transform: translateY(-5px);

            border-color: #37E359;

        }


        .ejercicio img {

            width: 100%;

            height: 230px;

            object-fit: cover;

            display: block;

        }


        .contenido {

            padding: 25px;

        }


        .numero {

            color: #37E359;

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 5px;

        }


        .contenido h3 {

            font-size: 23px;

            margin-bottom: 10px;

        }


        .contenido p {

            color: #aaa;

            line-height: 25px;

            margin-bottom: 15px;

        }


        .series {

            background: #252525;

            padding: 12px;

            border-radius: 8px;

            color: #37E359;

            font-weight: 600;

            margin-bottom: 15px;

        }


        .boton-explicacion {

            width: 100%;

            padding: 12px;

            border: 1px solid #37E359;

            border-radius: 9px;

            background: transparent;

            color: #37E359;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: .3s;

        }


        .boton-explicacion:hover {

            background: #37E359;

            color: #111;

        }


        /* =================================================
           MODAL
        ================================================= */

        .modal {

            display: none;

            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, .85);

            z-index: 9999;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }


        .modal.activo {

            display: flex;

        }


        .modal-contenido {

            width: 100%;

            max-width: 650px;

            background: #1b1b1b;

            border: 1px solid #37E359;

            border-radius: 20px;

            padding: 30px;

            position: relative;

            max-height: 90vh;

            overflow-y: auto;

        }


        .cerrar {

            position: absolute;

            top: 10px;

            right: 15px;

            width: 40px;

            height: 40px;

            border: none;

            background: #252525;

            color: white;

            border-radius: 50%;

            font-size: 25px;

            cursor: pointer;

            z-index: 5;

        }


        .cerrar:hover {

            background: #37E359;

            color: #111;

        }


        .modal-contenido img {

            width: 100%;

            height: 300px;

            object-fit: cover;

            border-radius: 14px;

            margin-bottom: 20px;

        }


        .modal-contenido h2 {

            color: #37E359;

            font-size: 30px;

            margin-bottom: 20px;

        }


        .modal-contenido h4 {

            color: white;

            font-size: 18px;

            margin-top: 20px;

            margin-bottom: 8px;

        }


        .modal-contenido p {

            color: #bbb;

            line-height: 1.8;

            font-size: 15px;

        }


        .modal-series {

            margin-top: 20px;

            background: #252525;

            padding: 15px;

            border-radius: 10px;

            color: #37E359;

            font-weight: 600;

        }


        footer {

            text-align: center;

            color: #777;

            padding: 40px;

        }


        /* =================================================
           MODO CLARO
        ================================================= */

        html.tema-claro body,
        body.tema-claro {

            background: #f5f5f5;

            color: #222;

        }


        html.tema-claro header,
        body.tema-claro header {

            background: #ffffff;

            border-bottom-color: #dddddd;

        }


        html.tema-claro .volver,
        body.tema-claro .volver {

            color: #555;

        }


        html.tema-claro .titulo p,
        body.tema-claro .titulo p {

            color: #666;

        }


        html.tema-claro .informacion,
        body.tema-claro .informacion {

            background: #ffffff;

        }


        html.tema-claro .dato span,
        body.tema-claro .dato span {

            color: #666;

        }


        html.tema-claro .dia,
        body.tema-claro .dia {

            background: #e8e8e8;

            color: #222;

        }


        html.tema-claro .dia:hover,
        body.tema-claro .dia:hover {

            background: #dcdcdc;

        }


        html.tema-claro .dia.activo,
        body.tema-claro .dia.activo {

            background: #37E359;

            color: #111;

        }


        html.tema-claro .ejercicio,
        body.tema-claro .ejercicio {

            background: #ffffff;

            border-color: #dddddd;

        }


        html.tema-claro .contenido p,
        body.tema-claro .contenido p {

            color: #666;

        }


        html.tema-claro .series,
        body.tema-claro .series {

            background: #eeeeee;

        }


        html.tema-claro .modal,
        body.tema-claro .modal {

            background: rgba(0, 0, 0, .45);

        }


        html.tema-claro .modal-contenido,
        body.tema-claro .modal-contenido {

            background: #ffffff;

        }


        html.tema-claro .cerrar,
        body.tema-claro .cerrar {

            background: #eeeeee;

            color: #222;

        }


        html.tema-claro .modal-contenido h4,
        body.tema-claro .modal-contenido h4 {

            color: #222;

        }


        html.tema-claro .modal-contenido p,
        body.tema-claro .modal-contenido p {

            color: #666;

        }


        html.tema-claro .modal-series,
        body.tema-claro .modal-series {

            background: #eeeeee;

        }


        html.tema-claro footer,
        body.tema-claro footer {

            color: #666;

        }


        /* =================================================
           RESPONSIVE
        ================================================= */

        @media(max-width:600px) {

            header {

                padding: 0 20px;

            }


            .logo {

                font-size: 30px;

            }


            .informacion {

                gap: 25px;

            }


            .modal-contenido {

                padding: 20px;

            }


            .modal-contenido img {

                height: 220px;

            }

        }

    </style>

</head>

<header>

<footer>

<script>


/* =========================================================
   DATOS DE LA URL
========================================================= */

const parametros =
    new URLSearchParams(
        window.location.search
    );


const pesoUsuario =
    parametros.get("peso");


const estaturaUsuario =
    parametros.get("estatura");


const tipoUsuario =
    parametros.get("tipo");



/* =========================================================
   MOSTRAR INFORMACIÓN
========================================================= */

document.getElementById("peso").textContent =
    pesoUsuario
        ? pesoUsuario + " kg"
        : "--";


document.getElementById("estatura").textContent =
    estaturaUsuario
        ? estaturaUsuario + " m"
        : "--";


document.getElementById("tipo").textContent =
    tipoUsuario === "casa"
        ? "Casa"
        : "Gimnasio";

/* =========================================================
   MOSTRAR EXPLICACIÓN
========================================================= */

function mostrarExplicacion(ejercicio) {

    modalImagen.src =
        ejercicio.imagen;

    modalImagen.alt =
        ejercicio.nombre;

    modalTitulo.textContent =
        ejercicio.nombre;

    modalExplicacion.textContent =
        ejercicio.explicacion;

    modalConsejo.textContent =
        ejercicio.consejo;

    modalSeries.textContent =
        ejercicio.series;

    modal.classList.add(
        "activo"
    );

    document.body.style.overflow =
        "hidden";

}



/* =========================================================
   CERRAR MODAL
========================================================= */

function cerrarExplicacion() {

    modal.classList.remove(
        "activo"
    );

    document.body.style.overflow =
        "";

}


cerrarModal.addEventListener(
    "click",
    cerrarExplicacion
);


modal.addEventListener(
    "click",
    function (event) {

        if (
            event.target === modal
        ) {

            cerrarExplicacion();

        }

    }
);


document.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Escape"
        ) {

            cerrarExplicacion();

        }

    }
);



/* =========================================================
   MOSTRAR RUTINA
========================================================= */

function mostrarRutina(dia) {


    botonesDias.forEach(
        function (boton) {

            boton.classList.remove(
                "activo"
            );

        }
    );


    const botonSeleccionado =
        document.querySelector(
            `.dia[data-dia="${dia}"]`
        );


    if (botonSeleccionado) {

        botonSeleccionado.classList.add(
            "activo"
        );

    }


    tituloDia.textContent =
        "Rutina del " +
        nombresDias[dia];


    let ejercicios;


    if (
        tipoUsuario === "casa"
    ) {

        ejercicios =
            casa[dia];

    }

    else {

        ejercicios =
            gym[dia];

    }


    contenedorEjercicios.innerHTML =
        "";


    if (
        !ejercicios ||
        ejercicios.length === 0
    ) {

        contenedorEjercicios.innerHTML =

            `
            <p style="
                color:#aaa;
                text-align:center;
                grid-column:1/-1;
            ">
                No hay ejercicios disponibles.
            </p>
            `;

        return;

    }


    ejercicios.forEach(
        function (
            ejercicio,
            indice
        ) {


            const tarjeta =
                document.createElement(
                    "div"
                );


            tarjeta.className =
                "ejercicio";


            /* IMAGEN */

            const imagen =
                document.createElement(
                    "img"
                );


            imagen.src =
                ejercicio.imagen;


            imagen.alt =
                ejercicio.nombre;


            /* CONTENIDO */

            const contenido =
                document.createElement(
                    "div"
                );


            contenido.className =
                "contenido";


            /* NÚMERO */

            const numero =
                document.createElement(
                    "div"
                );


            numero.className =
                "numero";


            numero.textContent =
                "EJERCICIO " +
                (indice + 1);


            /* NOMBRE */

            const nombre =
                document.createElement(
                    "h3"
                );


            nombre.textContent =
                ejercicio.nombre;


            /* DESCRIPCIÓN */

            const descripcion =
                document.createElement(
                    "p"
                );


            descripcion.textContent =
                ejercicio.descripcion;


            /* SERIES */

            const series =
                document.createElement(
                    "div"
                );


            series.className =
                "series";


            series.textContent =
                ejercicio.series;


            /* BOTÓN */

            const botonExplicacion =
                document.createElement(
                    "button"
                );


            botonExplicacion.className =
                "boton-explicacion";


            botonExplicacion.textContent =
                "Ver explicación";


            botonExplicacion.addEventListener(
                "click",
                function () {

                    mostrarExplicacion(
                        ejercicio
                    );

                }
            );


            /* AGREGAR */

            contenido.appendChild(
                numero
            );


            contenido.appendChild(
                nombre
            );


            contenido.appendChild(
                descripcion
            );


            contenido.appendChild(
                series
            );


            contenido.appendChild(
                botonExplicacion
            );


            tarjeta.appendChild(
                imagen
            );


            tarjeta.appendChild(
                contenido
            );


            contenedorEjercicios.appendChild(
                tarjeta
            );

        }
    );

}

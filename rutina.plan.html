        }

        }

        .volver:hover {
            color: #37E359;
        }

        .contenedor {
            width: 90%;
            max-width: 1200px;
            margin: 45px auto;
        }

        .titulo {
            text-align: center;
            margin-bottom: 30px;
        }

        .titulo h1 {
            color: #37E359;
            font-size: 38px;
        }

        .titulo p {
            color: #aaa;
            margin-top: 8px;
        }

        .informacion {
            background: #1b1b1b;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .dato {
            text-align: center;
            min-width: 110px;
        }

        .dato strong {
            display: block;
            color: #37E359;
            font-size: 20px;
        }

        .dato span {
            color: #aaa;
            font-size: 13px;
        }

        .dias {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        .dia {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: #252525;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: .2s;
        }

        .dia:hover {
            background: #333;
        }

        .dia.activo {
            background: #37E359;
            color: #111;
        }

        #tituloDia {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .ejercicios {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .ejercicio {
            background: #1b1b1b;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid #292929;
            transition: .3s;
            display: flex;
            flex-direction: column;
        }

        .ejercicio:hover {
            transform: translateY(-5px);
            border-color: #37E359;
        }

        .ejercicio img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            display: block;
        }

        .contenido {
            padding: 25px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .numero {
            color: #37E359;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .contenido h3 {
            font-size: 21px;
            margin-bottom: 10px;
        }

        .contenido p {
            color: #aaa;
            line-height: 24px;
            margin-bottom: 15px;
            font-size: 14px;
            flex-grow: 1;
        }

        .series {
            background: #252525;
            padding: 12px;
            border-radius: 8px;
            color: #37E359;
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .boton-explicacion {
            width: 100%;
            padding: 12px;
            border: 1px solid #37E359;
            border-radius: 9px;
            background: transparent;
            color: #37E359;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: .3s;
        }

        .boton-explicacion:hover {
            background: #37E359;
            color: #111;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .85);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.activo {
            display: flex;
        }

        .modal-contenido {
            width: 100%;
            max-width: 650px;
            background: #1b1b1b;
            border: 1px solid #37E359;
            border-radius: 20px;
            padding: 30px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .cerrar {
            position: absolute;
            top: 10px;
            right: 15px;
            width: 40px;
            height: 40px;
            border: none;
            background: #252525;
            color: white;
            border-radius: 50%;
            font-size: 25px;
            cursor: pointer;
            z-index: 5;
        }

        .cerrar:hover {
            background: #37E359;
            color: #111;
        }

        .modal-contenido img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 14px;
            margin-bottom: 20px;
        }

        .modal-contenido h2 {
            color: #37E359;
            font-size: 28px;
            margin-bottom: 15px;
        }

        .modal-contenido h4 {
            color: white;
            font-size: 16px;
            margin-top: 15px;
            margin-bottom: 6px;
        }

        .modal-contenido p {
            color: #bbb;
            line-height: 1.7;
            font-size: 14px;
        }

            margin-top: 18px;
            background: #252525;
            padding: 14px;
            border-radius: 10px;
            color: #37E359;
            font-weight: 600;
        }

        footer {
            text-align: center;
            color: #777;
            padding: 40px;
        }

        @media(max-width:600px) {
            header { padding: 0 20px; }
            .logo { font-size: 30px; }
            .informacion { gap: 15px; }

/* =========================================================
   ELEMENTOS Y ESTADO
========================================================= */
const contenedorEjercicios = document.getElementById("ejercicios");
const tituloDia = document.getElementById("tituloDia");
const contenedorBotonesDias = document.getElementById("contenedorBotonesDias");

const modal = document.getElementById("modal");
const cerrarModal = document.getElementById("cerrarModal");
const modalImagen = document.getElementById("modalImagen");
const modalTitulo = document.getElementById("modalTitulo");
const modalExplicacion = document.getElementById("modalExplicacion");
const modalConsejo = document.getElementById("modalConsejo");
const modalSeries = document.getElementById("modalSeries");

let rutinaActual = rutinasDefinir;
let diasPermitidos = 2; // Por defecto 2 días

const nombresDias = {
    lunes: "Lunes",
    martes: "Martes",
    miercoles: "Miércoles",
    jueves: "Jueves",
    viernes: "Viernes",
    sabado: "Sábado",
    domingo: "Domingo"
};

/* =========================================================
   CARGA INICIAL DE DATOS
========================================================= */
async function inicializarRutina() {
    const sesionUsuario = localStorage.getItem("usuario") || localStorage.getItem("usuarioLogueado");
    let usuario = null;

    if (sesionUsuario) {
        try {
            usuario = JSON.parse(sesionUsuario);
        } catch (e) {
            usuario = null;
        }
    }

    const parametros = new URLSearchParams(window.location.search);
    let peso = parametros.get("peso") || parametros.get("actual");
    let estatura = parametros.get("estatura");
    let tipo = parametros.get("tipo");
    let objetivo = parametros.get("objetivo");
    let diasURL = parametros.get("dias");

    if (diasURL) diasPermitidos = parseInt(diasURL);

    // Consulta en vivo a MySQL
    if (usuario && usuario.identificacion) {
        try {
            const res = await fetch(`${API}/usuario/${usuario.identificacion}/datos-fisicos`);
            if (res.ok) {
                const datosBD = await res.json();
                if (datosBD.peso) peso = datosBD.peso;
                if (datosBD.altura) estatura = datosBD.altura;
                if (datosBD.lugar_entrenamiento) tipo = datosBD.lugar_entrenamiento;
                if (datosBD.objetivo) objetivo = datosBD.objetivo;
                if (datosBD.dias_entreno) diasPermitidos = parseInt(datosBD.dias_entreno);
            }
        } catch (error) {
            console.error("Error consultando MySQL:", error);
        }
    }

    // Asegurar rango de 2 a 7 días
    diasPermitidos = Math.min(Math.max(diasPermitidos || 2, 2), 7);

    document.getElementById("peso").textContent = peso ? `${peso} kg` : "--";
    document.getElementById("estatura").textContent = estatura ? `${estatura} m` : "--";
    document.getElementById("tipo").textContent = tipo === "gimnasio" ? "Gimnasio" : "En Casa";
    document.getElementById("diasTexto").textContent = `${diasPermitidos} días`;

    const metaTexto = document.getElementById("meta");
    const tituloPrincipal = document.getElementById("encabezadoRutina");

    if (objetivo === "bajar_peso" || objetivo === "bajar") {
        rutinaActual = rutinasBajar;
        metaTexto.textContent = "Bajar de peso";
        tituloPrincipal.textContent = "Rutina Metabólica & Quema de Grasa";
    } else if (objetivo === "subir_peso" || objetivo === "subir") {
        rutinaActual = rutinasSubir;
        metaTexto.textContent = "Ganar masa";
        tituloPrincipal.textContent = "Rutina de Fuerza & Hipertrofia";
    } else {
        rutinaActual = rutinasDefinir;
        metaTexto.textContent = "Definir / Tono";
        tituloPrincipal.textContent = "Rutina de Definición & Calidad Muscular";
    }

    // Configurar y renderizar exactamente los botones correspondientes
    generarBotonesDias(diasPermitidos);
}

/* =========================================================
   GENERAR BOTONES DINÁMICOS SEGÚN LOS DÍAS SELECCIONADOS
========================================================= */
function generarBotonesDias(dias) {
    contenedorBotonesDias.innerHTML = "";

    const semanaCompleta = [
        { key: "lunes", label: "Lunes" },
        { key: "martes", label: "Martes" },
        { key: "miercoles", label: "Miércoles" },
        { key: "jueves", label: "Jueves" },
        { key: "viernes", label: "Viernes" },
        { key: "sabado", label: "Sábado" },
        { key: "domingo", label: "Domingo" }
    ];

    let esquema = [];

    if (dias === 2) {
        // Esquema especial de 2 días
        esquema = [
            { key: "lunes", label: "Día 1 (Torso / Fuerza)" },
            { key: "jueves", label: "Día 2 (Pierna / Core)" }
        ];
    } else if (dias === 3) {
        // Esquema clásico de 3 días
        esquema = [
            { key: "lunes", label: "Lunes" },
            { key: "miercoles", label: "Miércoles" },
            { key: "viernes", label: "Viernes" }
        ];
    } else {
        // De 4 hasta 7 días consecutivos
        esquema = semanaCompleta.slice(0, dias);
    }

    esquema.forEach((item, index) => {
        const boton = document.createElement("button");
        boton.className = `dia ${index === 0 ? "activo" : ""}`;
        boton.dataset.dia = item.key;
        boton.textContent = item.label;
        boton.addEventListener("click", () => mostrarRutina(item.key, item.label));
        contenedorBotonesDias.appendChild(boton);
    });

    if (esquema.length > 0) {
        mostrarRutina(esquema[0].key, esquema[0].label);
    }
}

/* =========================================================
   MOSTRAR EJERCICIOS DEL DÍA
========================================================= */
function mostrarRutina(dia, labelOpcional) {
    document.querySelectorAll(".dia").forEach(btn => {
        btn.classList.toggle("activo", btn.dataset.dia === dia);
    });

    tituloDia.textContent = labelOpcional ? `Rutina: ${labelOpcional}` : `Rutina del ${nombresDias[dia]}`;

    const lista = rutinaActual[dia] || [];
    contenedorEjercicios.innerHTML = "";

    if (lista.length === 0) {
        contenedorEjercicios.innerHTML = `
            <p style="color:#aaa; text-align:center; grid-column:1/-1;">
                Día libre de recuperación activa.
            </p>
        `;
        return;
    }

    lista.forEach((ejercicio, index) => {
        const card = document.createElement("div");
        card.className = "ejercicio";
        card.innerHTML = `
            <img src="${ejercicio.imagen}" alt="${ejercicio.nombre}" loading="lazy">
            <div class="contenido">
                <div class="numero">EJERCICIO ${index + 1}</div>
                <h3>${ejercicio.nombre}</h3>
                <p>${ejercicio.descripcion}</p>
                <div class="series">${ejercicio.series}</div>
                <button class="boton-explicacion">Ver explicación</button>
            </div>
        `;

        card.querySelector(".boton-explicacion").addEventListener("click", () => {
            mostrarExplicacion(ejercicio);
        });

        contenedorEjercicios.appendChild(card);
    });
}

/* =========================================================
   MODAL
========================================================= */
function mostrarExplicacion(ejercicio) {
    modalImagen.src = ejercicio.imagen;
    modalImagen.alt = ejercicio.nombre;
    modalTitulo.textContent = ejercicio.nombre;
    modalExplicacion.textContent = ejercicio.explicacion;
    modalConsejo.textContent = ejercicio.consejo;
    modalSeries.textContent = ejercicio.series;

    modal.classList.add("activo");
    document.body.style.overflow = "hidden";
}

function cerrar() {
    modal.classList.remove("activo");
    document.body.style.overflow = "";
}

cerrarModal.addEventListener("click", cerrar);
modal.addEventListener("click", (e) => { if (e.target === modal) cerrar(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") cerrar(); });

inicializarRutina();
</script>
